name: Add QB PPG rankings to profiles
on:
  push:
    paths:
      - '.github/workflows/add-qb-ppg.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements=[
            ("let board=[],players=[],rbPpgRanks=new Map(),position='ALL'", "let board=[],players=[],rbPpgRanks=new Map(),qbPpgRanks=new Map(),position='ALL'"),
            ("'te-rankings.json','rb-2025-ppg.json']", "'te-rankings.json','rb-2025-ppg.json','qb-2025-ppg.json']"),
            ("[b,p,q,rb,w,t,ppg]=d;rbPpgRanks=new Map((ppg.players||[]).map(x=>[N(x.name),x.rank]));", "[b,p,q,rb,w,t,ppg,qbPpg]=d;rbPpgRanks=new Map((ppg.players||[]).map(x=>[N(x.name),x.rank]));qbPpgRanks=new Map((qbPpg.players||[]).map(x=>[N(x.name),x.rank]));"),
            ("${p.position==='RB'&&rbPpgRanks.get(N(p.name))?`<div class=\"stat\"><span>2025 PPG rank</span><b>#${rbPpgRanks.get(N(p.name))}</b></div>`:''}`;", "${p.position==='RB'&&rbPpgRanks.get(N(p.name))?`<div class=\"stat\"><span>2025 PPG rank</span><b>#${rbPpgRanks.get(N(p.name))}</b></div>`:''}${p.position==='QB'&&qbPpgRanks.get(N(p.name))?`<div class=\"stat\"><span>2025 PPG rank</span><b>#${qbPpgRanks.get(N(p.name))}</b></div>`:''}`;")
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit('Expected code not found: '+old[:100])
            s=s.replace(old,new,1)
          p.write_text(s)
          Path('.github/workflows/add-qb-ppg.yml').unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/add-qb-ppg.yml
          git commit -m "Show 2025 QB PPG rank in player profiles"
          git push
