name: Analytics mobile dropdown preview
on:
  push:
    branches: [feature/analytics-dropdown-20261018]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Source checks
        run: |
          node tests/analytics-core.cjs
          for f in analytics/*.js analytics-dashboard.js; do node --check "$f"; done
          python -m py_compile tests/studio-real-site.py tests/studio-entry.py
      - name: Install browsers
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Site desktop and mobile regression
        run: python tests/studio-real-site.py
      - name: Dropdown deep-link and recovery regression
        run: python tests/studio-entry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-dropdown-test-screenshots
          path: tests/studio-verification/
          retention-days: 3
