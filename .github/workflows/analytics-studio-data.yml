name: Refresh analytics data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['big-board.json', 'ros-rankings.json', '.github/workflows/analytics-studio-data.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: analytics-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch and validate source data
        run: |
          node tests/analytics-core.cjs
          node tests/heatradar-routes.cjs
          python -u scripts/refresh-analytics-studio.py
      - name: Refresh ESPN full-PPR matchup ranks
        run: python -u scripts/refresh-espn-matchups.py
      - name: Rebuild ranked-player advanced usage from the refreshed snapshots
        run: node scripts/build-ranked-usage.cjs
      - name: Enrich ranked-player receiving metrics from nflverse
        run: python -u scripts/enrich-ranked-air-yards.py
      - name: Refresh permitted HeatRadar weekly route charting
        run: node scripts/refresh-heatradar-routes.cjs
      - name: Merge verified routes into ranked-player usage
        run: node scripts/enrich-ranked-heatradar-routes.cjs
      - name: Install expected-points data reader
        run: python -m pip install --disable-pip-version-check pyreadr
      - name: Merge ten source-backed advanced Usage statistics
        run: python -u scripts/enrich-ranked-advanced-usage.py
      - name: Merge twelve further verified Usage statistics
        run: python -u scripts/enrich-ranked-next-usage.py
      - name: Rebuild 32-team source-verified receiver efficiency heatmaps
        run: python -u scripts/build-receiver-efficiency.py
      - name: Validate advanced usage calculations
        run: |
          node tests/usage-extra-metrics.cjs
          node tests/usage-advanced-metrics.cjs
          node tests/usage-next-metrics.cjs
          node tests/fantasy-intelligence.cjs
          node tests/receiver-efficiency.cjs
      - name: Publish data snapshots only
        id: save
        run: |
          git config user.name 'SHUA Analytics Data'
          git config user.email 'actions@users.noreply.github.com'
          git add analytics/data analytics/espn-matchups-2026.json analytics/manifest.json analytics/rank-history.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Refresh source-attributed fantasy analytics data'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Request Pages rebuild after automated data commit
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
