name: Verify analytics studio staging
on:
  push:
    branches: ['analytics-studio/20261017']
    paths: ['.github/workflows/analytics-studio-staging.yml', 'tests/studio-real-site.py']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and calculation tests
        run: |
          node tests/analytics-core.cjs
          for f in analytics/*.js analytics-dashboard.js player-insights.js site-enhancements.js; do node --check "$f"; done
      - name: Install test browsers
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Test current-season dashboards, controls and existing navigation
        run: python tests/studio-real-site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-studio-verification
          path: tests/studio-verification/
