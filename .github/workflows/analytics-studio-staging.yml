name: Verify analytics studio staging
on:
  push:
    branches: ['analytics-studio/20261017']
    paths: ['staging-followup.py', '.github/workflows/analytics-studio-staging.yml', 'tests/studio-real-site.py']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply isolated followup and diagnose source
        run: python -u staging-followup.py
      - name: Syntax and calculation tests
        run: |
          node tests/analytics-core.cjs
          for f in analytics/*.js analytics-dashboard.js player-insights.js; do node --check "$f"; done
          python -m py_compile tests/studio-real-site.py scripts/prepare-analytics-studio.py
      - name: Prepare verified data and custom ranking revisions
        run: python -u scripts/prepare-analytics-studio.py
      - name: Record prepared tree on staging only
        run: |
          test "$GITHUB_REF_NAME" = 'analytics-studio/20261017'
          git config user.name 'SHUA Analytics Build'
          git config user.email 'actions@users.noreply.github.com'
          git add analytics analytics-dashboard.js player-insights.js index.html scripts/prepare-analytics-studio.py tests
          git diff --cached --quiet || git commit -m 'Verify integrated analytics studio assets [skip ci]'
          git push origin HEAD:analytics-studio/20261017
      - name: Install test browsers
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Test full site in Chromium and WebKit
        run: python tests/studio-real-site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-studio-verification
          path: tests/studio-verification/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-studio-source
          path: |
            analytics/
            analytics-dashboard.js
            player-insights.js
            index.html
            scripts/prepare-analytics-studio.py
            tests/studio-real-site.py
