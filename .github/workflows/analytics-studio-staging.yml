name: Verify analytics studio staging
on:
  push:
    branches: ['analytics-studio/20261017']
    paths: ['.github/workflows/analytics-studio-staging.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Open Injury Impact on a real comparable absence, not an empty scenario
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('analytics/ui.js');s=p.read_text()
          old='function injury(){const members='
          new="""function injury(){if(state.injuryInitialized!==state.year){state.injuryInitialized=state.year;const candidates=dataset.players.filter(p=>['RB','WR','TE'].includes(p.position)).filter(p=>Object.entries(p.availability||{}).some(([w,x])=>+w<=state.week&&String(x.status).toLowerCase()==='out')).sort((a,b)=>(A(b,state.week).points||0)-(A(a,state.week).points||0));for(const p of candidates){const weeks=Object.entries(p.availability||{}).filter(([w,x])=>+w<=state.week&&String(x.status).toLowerCase()==='out').map(([w])=>+w);const comparable=S.splits(dataset,p,p.team,state.week,weeks).rows.some(r=>r.nWith>0&&r.nWithout>0);if(comparable){state.team=p.team;state.player=p.key;state.outWeeks=null;break;}}}const members="""
          assert old in s;s=s.replace(old,new)
          s=s.replace("state.view=tab.dataset.stView;state.outWeeks=null;","state.view=tab.dataset.stView;state.outWeeks=null;if(state.view==='injury')state.injuryInitialized=0;")
          p.write_text(s)
          p=Path('tests/studio-real-site.py');s=p.read_text();old="    if view=='rankings':page.wait_for_selector('#stRankBody .st-chart',timeout=20000)";new=old+"\n    if view=='injury':assert page.locator('#stContent .st-chart').count()>=2,'Injury Impact did not choose a comparable source-confirmed absence'";assert old in s;p.write_text(s.replace(old,new))
          PY
      - name: Record final source on staging only
        run: |
          test "$GITHUB_REF_NAME" = 'analytics-studio/20261017'
          git config user.name 'SHUA Analytics Build'
          git config user.email 'actions@users.noreply.github.com'
          git add analytics/ui.js tests/studio-real-site.py
          git commit -m 'Default injury charts to source-confirmed comparable games [skip ci]'
          git push origin HEAD:analytics-studio/20261017
      - name: Syntax and calculation tests
        run: |
          node tests/analytics-core.cjs
          for f in analytics/*.js analytics-dashboard.js player-insights.js site-enhancements.js; do node --check "$f"; done
      - name: Install test browsers
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Test all current-season dashboards and existing navigation
        run: python tests/studio-real-site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-studio-verification
          path: tests/studio-verification/
