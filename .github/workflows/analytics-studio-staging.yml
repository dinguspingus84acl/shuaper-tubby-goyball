name: Verify analytics studio staging
on:
  push:
    branches: ['analytics-studio/20261017']
    paths: ['.github/workflows/analytics-studio-staging.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fit category labels inside their chart cells
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('analytics/charts.js');s=p.read_text()
          old='labels.forEach((label,i)=>{const x=L+cell*i+cell/2;body+='
          new='labels.forEach((label,i)=>{const x=L+cell*i+cell/2,cap=Math.max(5,Math.floor((cell-7)/6));body+='
          assert old in s
          s=s.replace(old,new).replace("label.length>16?label.slice(0,15)+'…':label","label.length>cap?label.slice(0,cap-1)+'…':label")
          p.write_text(s)
          PY
      - name: Record final source on staging only
        run: |
          test "$GITHUB_REF_NAME" = 'analytics-studio/20261017'
          git config user.name 'SHUA Analytics Build'
          git config user.email 'actions@users.noreply.github.com'
          git add analytics/charts.js
          git commit -m 'Fit chart labels without clipping player controls [skip ci]'
          git push origin HEAD:analytics-studio/20261017
      - name: Syntax, calculation and data validation tests
        run: |
          node tests/analytics-core.cjs
          for f in analytics/*.js analytics-dashboard.js player-insights.js site-enhancements.js; do node --check "$f"; done
          python - <<'PY'
          import importlib.util,json,pathlib
          p=pathlib.Path('scripts/refresh-analytics-studio.py')
          spec=importlib.util.spec_from_file_location('refresh',p);mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          for f in pathlib.Path('analytics/data').glob('season-*.json'):mod.validate(json.loads(f.read_text()))
          try:mod.validate({'players':[]})
          except ValueError:pass
          else:raise AssertionError('Empty dataset accepted')
          print('PASS: source dataset validation')
          PY
      - name: Install test browsers
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Test current-season dashboards and existing navigation
        run: python tests/studio-real-site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-studio-verification
          path: tests/studio-verification/
