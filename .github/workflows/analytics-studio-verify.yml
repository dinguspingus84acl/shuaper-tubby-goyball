name: Verify Analytics Studio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['analytics/*.js', 'analytics/*.css', 'analytics-dashboard.js', 'player-insights.js', 'site-enhancements.js', 'tests/studio-*.py', '.github/workflows/analytics-studio-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and calculation tests
        run: |
          node tests/analytics-core.cjs
          for f in analytics/*.js analytics-dashboard.js player-insights.js site-enhancements.js; do node --check "$f"; done
      - name: Install verification browsers
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Test dashboards, profiles and existing navigation
        run: python tests/studio-real-site.py
      - name: Test direct links, expanded charts and recovery
        run: python tests/studio-entry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-studio-local-verification
          path: tests/studio-verification/
      - name: Wait for this release to reach GitHub Pages
        run: |
          python - <<'PY'
          import pathlib, re, time, urllib.request
          expected = pathlib.Path('analytics-dashboard.js').read_text()
          version = re.search(r"const version\s*=\s*'([^']+)'", expected)[1]
          for attempt in range(48):
              try:
                  url = 'https://shuapertubbygoyball.com/analytics-dashboard.js?release=' + version
                  with urllib.request.urlopen(url, timeout=15) as response:
                      source = response.read().decode()
                  if source.strip() == expected.strip():
                      print('Exact release served by the public website'); break
              except Exception as error:
                  print(type(error).__name__)
              time.sleep(5)
          else:
              raise SystemExit('GitHub Pages has not served this release yet.')
          PY
      - name: Verify the actual public website in both browser engines
        env:
          STUDIO_BASE_URL: https://shuapertubbygoyball.com/
        run: python tests/studio-entry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-studio-live-verification
          path: tests/studio-verification/
