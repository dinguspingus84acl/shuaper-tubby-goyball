name: Apply RB colors

on:
  push:
    paths:
      - '.github/workflows/apply-rb-colors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore latest RB ranks and apply color lists
        run: |
          git show f9a69900736269a664804fc2794f683fc758b74e:rb-rankings.json > rb-rankings.json
          python - <<'PY'
          import json
          from pathlib import Path

          my_guys = {
              'James Cook','Ashton Jeanty','Omarion Hampton','Chase Brown','Kenneth Walker',
              'Josh Jacobs','Javonte Williams','David Montgomery','Bhayshul Tuten','Jordan Mason',
              'Blake Corum','Jonathon Brooks','Kenny Gainwell','Rachaad White','Keaton Mitchell',
              'Dylan Sampson','Ray Davis','Tank Bigsby','Emmett Johnson','Jonah Coleman',
              'MarShawn Lloyd','Samaje Perine','Mike Washington','Seth McGowan'
          }
          do_not_draft = {
              'Jonathan Taylor','Jeremiyah Love','Quinshon Judkins','TreVeyon Henderson','Bucky Irving',
              'Rj Harvey','JK Dobbins','Chuba Hubbard','Aaron Jones','Kyle Monangai',
              'Jacory Croskey-Merritt','Alvin Kamara','Zach Charbonnet','James Conner','Tyrone Tracy'
          }

          rb_path = Path('rb-rankings.json')
          rb = json.loads(rb_path.read_text())
          for player in rb.get('players', []):
              name = str(player.get('name','')).strip()
              player['tag'] = 'draft' if name in my_guys else ('do-not-draft' if name in do_not_draft else '')
          rb_path.write_text(json.dumps(rb, ensure_ascii=False, separators=(',', ':')))

          colors_path = Path('player-color-tags.json')
          colors = json.loads(colors_path.read_text())
          colors['RB'] = {
              'do-not-draft': ['Jonathan Taylor','Jeremiyah Love','Quinshon Judkins','TreVeyon Henderson','Bucky Irving','Rj Harvey','JK Dobbins','Chuba Hubbard','Aaron Jones','Kyle Monangai','Jacory Croskey-Merritt','Alvin Kamara','Zach Charbonnet','James Conner','Tyrone Tracy'],
              'draft': ['James Cook','Ashton Jeanty','Omarion Hampton','Chase Brown','Kenneth Walker','Josh Jacobs','Javonte Williams','David Montgomery','Bhayshul Tuten','Jordan Mason','Blake Corum','Jonathon Brooks','Kenny Gainwell','Rachaad White','Keaton Mitchell','Dylan Sampson','Ray Davis','Tank Bigsby','Emmett Johnson','Jonah Coleman','MarShawn Lloyd','Samaje Perine','Mike Washington','Seth McGowan']
          }
          colors_path.write_text(json.dumps(colors, ensure_ascii=False, separators=(',', ':')))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rb-rankings.json player-color-tags.json
          git commit -m "Apply RB My Guys and Do Not Draft colors"
          git push
