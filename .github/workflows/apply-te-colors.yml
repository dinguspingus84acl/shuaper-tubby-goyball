name: Apply TE colors

on:
  push:
    paths:
      - '.github/workflows/apply-te-colors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply TE My Guys and Do Not Draft lists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          my_guys = {
              'Brock Bowers','Colston Loveland','Tyler Warren','Isaiah Likely','Greg Dulcich',
              'Dalton Kincaid','Dallas Goedert','Mark Andrews','Terrance Ferguson','Dalton Schultz',
              'Juwan Johnson','Gunnar Helm'
          }
          do_not_draft = {
              'Trey McBride','Sam LaPorta','Kyle Pitts','Jake Ferguson','Kenyon Sadiq',
              'Oronde Gadsden','Eli Stowers'
          }

          te_path = Path('te-rankings.json')
          te = json.loads(te_path.read_text())
          for player in te.get('players', []):
              name = str(player.get('name','')).strip()
              if name in my_guys:
                  player['tag'] = 'draft'
              elif name in do_not_draft:
                  player['tag'] = 'do-not-draft'
              else:
                  player['tag'] = ''
          te_path.write_text(json.dumps(te, ensure_ascii=False, separators=(',', ':')))

          colors_path = Path('player-color-tags.json')
          colors = json.loads(colors_path.read_text())
          colors['TE'] = {
              'do-not-draft': ['Trey McBride','Sam LaPorta','Kyle Pitts','Jake Ferguson','Kenyon Sadiq','Oronde Gadsden','Eli Stowers'],
              'draft': ['Brock Bowers','Colston Loveland','Tyler Warren','Isaiah Likely','Greg Dulcich','Dalton Kincaid','Dallas Goedert','Mark Andrews','Terrance Ferguson','Dalton Schultz','Juwan Johnson','Gunnar Helm']
          }
          colors_path.write_text(json.dumps(colors, ensure_ascii=False, separators=(',', ':')))
          PY
      - name: Commit TE color update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add te-rankings.json player-color-tags.json
          git diff --cached --quiet || git commit -m "Apply TE My Guys and Do Not Draft colors"
          git push
