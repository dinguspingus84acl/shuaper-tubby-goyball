name: Apply WR colors

on:
  push:
    paths:
      - '.github/workflows/apply-wr-colors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply WR My Guys and Do Not Draft lists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          my_guys = {
            'A.J. Brown','Chris Olave','Ladd McConkey','DeVonta Smith','Jaylen Waddle','Emeka Egbuka','Zay Flowers','Rome Odunze','Christian Watson','Marvin Harrison','Michael Pittman','Chris Godwin','Quentin Johnston','Josh Downs','Jalen Coker','Caleb Douglas','Cyrus Allen','Kayshon Boutte','DJ Moore','Parker Washington','Luther Burden','KC Concepcion',"Wan'Dale Robinson",'Romeo Doubs','Deebo Samuel','Stefon Diggs','De’Zhaun Stribling','Rashid Shaheed','Jalen McMillan','Jalen Nailor','Denzel Boston','Zachariah Branch','Dontayvion Wicks','Jaylin Noel','Bryce Lance','Ja’Kobi Lane','Ryan Flournoy'
          }
          do_not_draft = {
            'Nico Collins','Garrett Wilson','Terry McLaurin','Tetairoa McMillan','Carnell Tate','Mike Evans','Alec Pierce','Makai Lemon','Brian Thomas','Courtland Sutton','Jameson Williams','DK Metcalf','Michael Wilson','Xavier Worthy','Jordyn Tyson','Matthew Golden','Cooper Kupp','Travis Hunter','Jerry Jeudy','Tank Dell'
          }

          wr_path = Path('wr-rankings.json')
          wr = json.loads(wr_path.read_text())
          for player in wr.get('players', []):
              name = str(player.get('name','')).strip()
              if name in my_guys:
                  player['tag'] = 'draft'
              elif name in do_not_draft:
                  player['tag'] = 'do-not-draft'
              else:
                  player['tag'] = ''
          wr_path.write_text(json.dumps(wr, ensure_ascii=False, separators=(',', ':')))

          colors_path = Path('player-color-tags.json')
          colors = json.loads(colors_path.read_text())
          colors['WR'] = {
            'do-not-draft': ['Nico Collins','Garrett Wilson','Terry McLaurin','Tetairoa McMillan','Carnell Tate','Mike Evans','Alec Pierce','Makai Lemon','Brian Thomas','Courtland Sutton','Jameson Williams','DK Metcalf','Michael Wilson','Xavier Worthy','Jordyn Tyson','Matthew Golden','Cooper Kupp','Travis Hunter','Jerry Jeudy','Tank Dell'],
            'draft': ['A.J. Brown','Chris Olave','Ladd McConkey','DeVonta Smith','Jaylen Waddle','Emeka Egbuka','Zay Flowers','Rome Odunze','Christian Watson','Marvin Harrison','Michael Pittman','Chris Godwin','Quentin Johnston','Josh Downs','Jalen Coker','Caleb Douglas','Cyrus Allen','Kayshon Boutte','DJ Moore','Parker Washington','Luther Burden','KC Concepcion',"Wan'Dale Robinson",'Romeo Doubs','Deebo Samuel','Stefon Diggs','De’Zhaun Stribling','Rashid Shaheed','Jalen McMillan','Jalen Nailor','Denzel Boston','Zachariah Branch','Dontayvion Wicks','Jaylin Noel','Bryce Lance','Ja’Kobi Lane','Ryan Flournoy']
          }
          colors_path.write_text(json.dumps(colors, ensure_ascii=False, separators=(',', ':')))
          PY
      - name: Commit WR color update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wr-rankings.json player-color-tags.json
          git commit -m "Apply WR My Guys and Do Not Draft colors"
          git push
