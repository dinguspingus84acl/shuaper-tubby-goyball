name: build legacy stats

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-legacy-stats.mjs'
      - '.github/workflows/build-legacy-stats.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build 2010-2017 stats
        run: node scripts/build-legacy-stats.mjs
      - name: Commit generated legacy stats
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- legacy-stats)" ]; then
            echo "Legacy stats already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-stats
          git commit -m "Generate legacy stats data"
          git pull --rebase origin main
          git push
