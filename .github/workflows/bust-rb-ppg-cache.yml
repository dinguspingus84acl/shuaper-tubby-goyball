name: Bust RB PPG cache

on:
  push:
    paths:
      - '.github/workflows/bust-rb-ppg-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update RB PPG script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          for old in ['rb-ppg.js?v=1','rb-ppg.js?v=2','rb-ppg.js?v=3','rb-ppg.js?v=4']:
              s=s.replace(old,'rb-ppg.js?v=5')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Bust RB PPG script cache" && git push)
