name: debug historical face source
on:
  push:
    paths:
      - 'scripts/debug-historical-face.mjs'
      - '.github/workflows/debug-historical-face.yml'
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/debug-historical-face.mjs
