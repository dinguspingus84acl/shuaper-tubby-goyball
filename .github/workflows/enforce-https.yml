name: Enforce Pages HTTPS

on:
  push:
    paths:
      - '.github/workflows/enforce-https.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pages certificate
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh api repos/${{ github.repository }}/pages --jq '.https_certificate.state')
          echo "Certificate state: $state"
          if [ "$state" != "approved" ]; then
            echo "Certificate is not approved yet."
            exit 1
          fi

      - name: Enforce HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT repos/${{ github.repository }}/pages \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -F https_enforced=true

      - name: Verify HTTPS enforcement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/pages --jq '{certificate: .https_certificate.state, https_enforced: .https_enforced, url: .html_url}'
