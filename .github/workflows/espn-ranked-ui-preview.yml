name: Verified ESPN Matchups UI Preview
on:
  push:
    branches: [feature/espn-ranked-schedule-20261018]
    paths:
      - 'analytics/**'
      - 'espn-live.js'
      - 'sos.js'
      - 'index.html'
      - 'analytics-dashboard.js'
      - 'tests/**'
      - '.github/workflows/espn-ranked-ui-preview.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and verified ESPN full-PPR feed
        run: |
          node tests/analytics-core.cjs
          for f in analytics/*.js analytics-dashboard.js espn-live.js sos.js; do node --check "$f"; done
          python -m py_compile tests/studio-real-site.py tests/studio-entry.py scripts/refresh-espn-matchups.py
          python - <<'PY'
          import json
          p=json.load(open('analytics/espn-matchups-2026.json'))
          assert p['source']=='ESPN Fantasy Football mPositionalRatings'
          assert p['scoring']=='full PPR; 4-point passing TD'
          assert p['positions']['QB']['DET']['rank']==32
          assert p['positions']['QB']['MIN']['rank']==1
          assert all(len(p['positions'][pos])==32 for pos in ['QB','RB','WR','TE','DST'])
          print('PASS: Verified full PPR ESPN ranks for 5 positions / 32 teams')
          PY
      - name: Install Chromium and WebKit
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Test complete website and game-log matchup consistency
        run: python tests/studio-real-site.py
      - name: Test direct links, chart dropdown and recovery
        run: python tests/studio-entry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: espn-matchup-site-verification
          path: tests/studio-verification/
          retention-days: 3
