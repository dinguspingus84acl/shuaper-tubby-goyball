name: Fix early QB recommendations

on:
  push:
    paths:
      - '.github/workflows/fix-early-qb-recommendations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add round-sensitive positional value
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('decision-engine.js')
          text = path.read_text(encoding='utf-8')

          old = """  function scorePlayer(player) {
    const rankValue = Math.max(0, 30 - Math.min(30, (getRank(player) - 1) * .35));
    const need = needScore(player.position);
    const drop = Math.min(20, tierDrop(player) * 1.5);
    const survival = Math.max(0, 15 - returnChance(player) * .15);
    const adp = 4 + getAdpValue(player) * .35;
    const tag = player.additionalStats?.tag === 'draft' ? 5 : player.additionalStats?.tag === 'do-not-draft' ? -12 : 0;
    const run = recentRun(player.position) >= 3 ? 4 : 0;
    return Math.max(0, Math.min(100, Math.round(rankValue + need + drop + survival + adp + tag + run)));
  }
"""

          new = """  function currentRound() {
    return mock?.active ? Math.floor(mock.picks.length / mock.teams) + 1 : 1;
  }

  function positionalRoundAdjustment(player) {
    const round = currentRound();
    const mine = myPlayers();
    const hasQB = mine.some(x => x.position === 'QB');

    if (player.position === 'QB') {
      if (hasQB) return -18;
      if (round === 1) return -45;
      if (round === 2) return -30;
      if (round === 3) return -16;
      if (round === 4) return -7;
      if (round === 5) return 0;
      return 4;
    }

    if ((player.position === 'RB' || player.position === 'WR') && round <= 2) return 8;
    if ((player.position === 'RB' || player.position === 'WR') && round <= 4) return 4;
    if (player.position === 'TE' && round === 1) return -6;
    return 0;
  }

  function scorePlayer(player) {
    const rankValue = Math.max(0, 30 - Math.min(30, (getRank(player) - 1) * .35));
    const need = needScore(player.position);
    const drop = Math.min(20, tierDrop(player) * 1.5);
    const survival = Math.max(0, 15 - returnChance(player) * .15);
    const adp = 4 + getAdpValue(player) * .35;
    const tag = player.additionalStats?.tag === 'draft' ? 5 : player.additionalStats?.tag === 'do-not-draft' ? -12 : 0;
    const run = recentRun(player.position) >= 3 ? 4 : 0;
    const roundAdjustment = positionalRoundAdjustment(player);
    return Math.max(0, Math.min(100, Math.round(rankValue + need + drop + survival + adp + tag + run + roundAdjustment)));
  }
"""

          if old not in text:
              raise SystemExit('Expected scorePlayer block not found; refusing unsafe patch')

          text = text.replace(old, new, 1)

          old_filter = ".filter(x => !used.has(x.id) && POSITIONS.includes(x.position))"
          new_filter = ".filter(x => !used.has(x.id) && POSITIONS.includes(x.position) && !(currentRound() === 1 && x.position === 'QB'))"
          if old_filter not in text:
              raise SystemExit('Expected recommendation filter not found; refusing unsafe patch')
          text = text.replace(old_filter, new_filter, 1)

          old_reason = "    const value = getAdpValue(player);\n"
          new_reason = "    const value = getAdpValue(player);\n    const round = currentRound();\n    if (player.position === 'QB' && round <= 4) out.push(`QB value is discounted in Round ${round} of a one-QB league`);\n"
          if old_reason not in text:
              raise SystemExit('Expected reasons block not found; refusing unsafe patch')
          text = text.replace(old_reason, new_reason, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decision-engine.js
          if ! git diff --cached --quiet; then
            git commit -m "Use round-sensitive QB value in draft engine"
            git push
          fi
