name: Fix phone-mode player headshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-phone-headshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore compact player headshots in phone mode
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = ".phone-mode #tableCard tbody tr{display:grid!important;grid-template-columns:44px minmax(0,1fr) 66px 54px!important;"
          new = ".phone-mode #tableCard tbody tr{display:grid!important;grid-template-columns:44px minmax(0,1fr) 66px 54px!important;"
          if old not in s:
              raise SystemExit('Phone table layout marker not found')
          s = s.replace('.phone-mode #tableCard .photo{display:none!important}', '.phone-mode #tableCard .photo{display:flex!important;width:32px!important;height:32px!important;flex:0 0 32px!important;border-width:1px!important}', 1)
          s = s.replace('.phone-mode #tableCard .photo-cell{display:block!important;min-width:0!important}', '.phone-mode #tableCard .photo-cell{display:flex!important;align-items:center!important;gap:7px!important;min-width:0!important}', 1)
          s = s.replace('.phone-mode #tableCard .photo-cell b{display:block!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}', '.phone-mode #tableCard .photo-cell b{display:block!important;min-width:0!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore player headshots in phone ranking rows"
          git push
