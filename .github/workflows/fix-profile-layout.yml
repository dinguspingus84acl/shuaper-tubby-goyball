name: Fix profile layout

on:
  push:
    paths:
      - '.github/workflows/fix-profile-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update profile photo and helmet layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''.profile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin:14px 0 18px}.person{display:flex;align-items:center;gap:14px}.helmet{position:relative;width:118px;height:80px;flex:0 0 118px;display:flex;align-items:center;justify-content:center;padding-right:25px;background:linear-gradient(145deg,#fff,#cbd5e1);border:4px solid #111827;border-radius:60px 52px 34px 39px;margin-right:16px}.helmet:before{content:'';position:absolute;right:-25px;top:29px;width:43px;height:35px;border:5px solid #111827;border-left:0;border-radius:0 22px 22px 0}.helmet:after{content:'';position:absolute;right:-12px;bottom:0;width:34px;height:23px;border-right:6px solid #111827;border-bottom:6px solid #111827;border-radius:0 0 15px}.helmet img{width:62px;height:62px;object-fit:contain}'''
          new = '''.profile-top{display:flex;justify-content:space-between;align-items:center;gap:24px;margin:14px 0 24px;min-height:150px}.person{display:flex;align-items:center}.helmet{position:relative;width:190px;height:125px;flex:0 0 190px;display:flex;align-items:center;justify-content:center;padding:10px 48px 10px 12px;background:linear-gradient(145deg,#fff 0%,#eef3f8 52%,#cbd5e1 100%);border:3px solid #111827;border-radius:96px 84px 54px 62px;margin-right:28px;box-shadow:inset -18px -12px 22px rgba(15,23,42,.16),0 10px 24px rgba(0,0,0,.3)}.helmet:before{content:'';position:absolute;right:-42px;top:44px;width:72px;height:58px;border:7px solid #111827;border-left:0;border-radius:0 34px 34px 0;transform:skewY(-5deg)}.helmet:after{content:'';position:absolute;right:-20px;bottom:2px;width:54px;height:38px;border-right:8px solid #111827;border-bottom:8px solid #111827;border-radius:0 0 24px 0}.helmet img{width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}'''
          if old not in text:
              raise SystemExit('Expected profile CSS block not found')
          text = text.replace(old, new, 1)

          old_markup = '''$('#profileTop').innerHTML=`<div class="person">${pic(p.name,'lg')}<div><b>${p.name}</b><br><span>${p.team} · ${p.position}</span></div></div>${helmet(p.team)}`;'''
          new_markup = '''$('#profileTop').innerHTML=`<div class="person">${pic(p.name,'lg')}</div>${helmet(p.team)}`;'''
          if old_markup not in text:
              raise SystemExit('Expected profile markup not found')
          text = text.replace(old_markup, new_markup, 1)

          text = text.replace('.person div{display:none}', '', 1)
          text = text.replace('.helmet{width:86px;height:60px;flex-basis:86px}.helmet img{width:46px;height:46px}.helmet:before{right:-18px;top:21px;width:31px;height:26px}.helmet:after{right:-9px;width:25px;height:18px}', '.helmet{width:120px;height:80px;flex-basis:120px;margin-right:18px;padding-right:30px}.helmet img{width:66px;height:66px}.helmet:before{right:-27px;top:29px;width:46px;height:37px}.helmet:after{right:-12px;width:34px;height:24px}', 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix player profile photo and helmet layout"
          git push
