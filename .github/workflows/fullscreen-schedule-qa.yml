name: Fullscreen Schedule and ROS best-ranks QA
on:
  push:
    branches: [feature/schedule-fullscreen-best-20261018]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and ESPN source checks
        run: |
          node tests/analytics-core.cjs
          for file in analytics/*.js analytics-dashboard.js; do node --check "$file"; done
          python -m py_compile tests/studio-real-site.py tests/studio-entry.py
          python - <<'PY'
          import json
          p=json.load(open('analytics/espn-matchups-2026.json'))
          assert all(len(p['positions'][pos])==32 for pos in ('QB','RB','WR','TE','DST'))
          print('Verified 32 teams for each position')
          PY
      - name: Install browsers
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify Schedule screen, ranking order and hover
        run: python tests/studio-real-site.py
      - name: Verify analytics links and mobile reloads
        run: python tests/studio-entry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullscreen-schedule-qa
          path: tests/studio-verification/
          retention-days: 3
