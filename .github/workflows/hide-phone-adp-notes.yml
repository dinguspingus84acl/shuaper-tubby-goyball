name: Hide ADP and Notes in Phone Mode

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide-phone-adp-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide table ADP and notes in phone mode
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '.phone-mode .room-bar>div:last-child button{flex:1}'
          addition = marker + '.phone-mode #tableCard th:nth-child(5),.phone-mode #tableCard td:nth-child(5),.phone-mode #tableCard th:nth-child(6),.phone-mode #tableCard td:nth-child(6){display:none!important}'
          if addition in text:
              raise SystemExit(0)
          if marker not in text:
              raise SystemExit('Phone mode CSS marker not found')
          text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Hide ESPN ADP and notes in phone mode"
          git push
