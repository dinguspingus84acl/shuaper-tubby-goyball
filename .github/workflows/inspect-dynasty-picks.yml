name: Inspect Dynasty Daddy pick data
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-dynasty-picks.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect web app assets and API hints
        run: |
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          base='https://dynasty-daddy.com/fantasy-rankings'
          html=requests.get(base,timeout=30).text
          print('HTML',len(html))
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html)
          print('SCRIPTS',len(srcs))
          for src in srcs:
              print('SCRIPT',src)
          for src in srcs:
              try:
                  url=urljoin(base,src)
                  js=requests.get(url,timeout=30).text
              except Exception as e:
                  print('ERR',src,e); continue
              low=js.lower()
              if 'draft pick' in low or 'pick_value' in low or 'pickvalue' in low or '/api/' in low and 'pick' in low:
                  print('MATCHING_ASSET',url,'LEN',len(js))
                  for pat in ['draft pick','pick_value','pickvalue','future pick','rookie pick','/api/']:
                      start=0
                      while True:
                          i=low.find(pat,start)
                          if i<0: break
                          print('HIT',pat,js[max(0,i-350):i+700].replace('\n',' ')[:1100])
                          start=i+len(pat)
                          if start>i+50000: break
          PY
