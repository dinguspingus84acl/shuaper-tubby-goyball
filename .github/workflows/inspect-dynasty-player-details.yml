name: Inspect Dynasty player details API
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-dynasty-player-details.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect headers and sample
        run: |
          set -e
          for kind in details history trades; do
            case "$kind" in
              details) URL='https://dynasty-daddy.com/api/v1/player/details/joshallenqb' ;;
              history) URL='https://dynasty-daddy.com/api/v1/player/joshallenqb?isAllTime=false' ;;
              trades) URL='https://dynasty-daddy.com/api/v1/player/details/trade/joshallenqb' ;;
            esac
            echo "--- $kind HEADERS ---"
            curl -sS -D - -o "/tmp/$kind.json" "$URL" | head -40
            echo "--- $kind SIZE ---"
            wc -c "/tmp/$kind.json"
            echo "--- $kind SAMPLE ---"
            KIND="$kind" python - <<'PY'
import json, os
kind=os.environ['KIND']
j=json.load(open('/tmp/'+kind+'.json'))
print(type(j).__name__)
if isinstance(j,dict):
    print('keys',list(j.keys()))
    for k,v in j.items():
        if isinstance(v,list):
            print(k,'list',len(v),'sample',v[:3])
        elif isinstance(v,dict):
            print(k,'dict keys',list(v.keys())[:40], 'sample', str(v)[:1000])
        else:
            print(k,type(v).__name__,str(v)[:500])
elif isinstance(j,list):
    print('len',len(j),'sample',j[:5])
PY
          done
