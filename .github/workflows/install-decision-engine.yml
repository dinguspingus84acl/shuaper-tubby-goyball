name: Install mock draft decision engine

on:
  push:
    paths:
      - '.github/workflows/install-decision-engine.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add decision engine script to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="decision-engine.js"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '</body>')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Install mock draft decision engine"
            git push
          fi
