name: Install mock draft UI

on:
  push:
    paths:
      - '.github/workflows/install-mock-sleeper-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mock draft UI script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="mock-draft-ui.js"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'</body></html>')
          p.write_text(s)
          PY
      - name: Commit installer result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load Sleeper-style mock draft UI"
          git push
