name: Install player colors
on:
  push:
    paths:
      - '.github/workflows/install-player-colors.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install color script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); text=p.read_text(encoding='utf-8')
          tag='<script src="player-colors.js"></script>'
          if tag not in text:
              text=text.replace('</body>',tag+'</body>')
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Show updated player colors" && git push; fi
