name: Install site enhancements

on:
  push:
    paths:
      - '.github/workflows/install-site-enhancements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="site-enhancements.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit installation
        run: |
          if git diff --quiet; then
            echo "Already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Install My Guys filter, team logos, and admin editor"
          git push
