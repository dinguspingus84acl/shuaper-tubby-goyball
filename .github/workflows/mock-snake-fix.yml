name: Fix Mock Draft Snake Layout
on:
  push:
    paths:
      - '.github/workflows/mock-snake-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply snake layout to mock draft
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = '''$("#draftBoard").style.gridTemplateColumns=`repeat(${mock.teams},minmax(125px,1fr))`;const visibleSlots=Math.min(total,Math.max(mock.teams*2,Math.ceil((pickIndex+mock.teams)/mock.teams)*mock.teams));$("#draftBoard").innerHTML=Array.from({length:visibleSlots},(_,i)=>{const d=mock.picks[i],team=snakeTeamForPick(i,mock.teams);if(!d)return`<div class="drafted empty-slot"><div class="slot">${slotLabel(i,mock.teams)} · Team ${team}</div></div>`;const p=d.player;return`<div class="drafted ${String(p.position).toLowerCase()} ${d.team===mock.slot?"user-pick":""}"><div class="slot">${slotLabel(i,mock.teams)} · Team ${d.team}</div><div class="name">${shortName(p.name)}</div><div class="team">${p.position} · ${p.team}</div></div>`}).join("");'''
          new = '''$("#draftBoard").style.gridTemplateColumns=`repeat(${mock.teams},minmax(125px,1fr))`;const visibleSlots=Math.min(total,Math.max(mock.teams*2,Math.ceil((pickIndex+mock.teams)/mock.teams)*mock.teams));const displayIndexes=[];for(let start=0;start<visibleSlots;start+=mock.teams){const round=Math.floor(start/mock.teams)+1,chunk=Array.from({length:Math.min(mock.teams,visibleSlots-start)},(_,j)=>start+j);if(round%2===0)chunk.reverse();displayIndexes.push(...chunk)}$("#draftBoard").innerHTML=displayIndexes.map(i=>{const d=mock.picks[i],team=snakeTeamForPick(i,mock.teams);if(!d)return`<div class="drafted empty-slot"><div class="slot">${slotLabel(i,mock.teams)} · Team ${team}</div></div>`;const p=d.player;return`<div class="drafted ${String(p.position).toLowerCase()} ${d.team===mock.slot?"user-pick":""}"><div class="slot">${slotLabel(i,mock.teams)} · Team ${d.team}</div><div class="name">${shortName(p.name)}</div><div class="team">${p.position} · ${p.team}</div></div>`}).join("");'''
          if old not in text:
              raise SystemExit('Expected mock draft board block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/mock-snake-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/mock-snake-fix.yml
          git commit -m "Fix mock draft snake board order"
          git push
