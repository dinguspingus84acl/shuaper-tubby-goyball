name: Premium analytics preview
on:
  push:
    branches: [build/premium-analytics]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: build/premium-analytics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified weekly datasets
        env:
          ANALYTICS_SEASON: '2026'
        run: python scripts/build-analytics-data.py
      - name: Check source syntax
        run: |
          node --check analytics-dashboard.js
          if [ -f analytics-core.js ]; then node --check analytics-core.js; fi
          if [ -f analytics-ui.js ]; then node --check analytics-ui.js; fi
          if [ -f tests/analytics.test.cjs ]; then node --test tests/analytics.test.cjs; fi
      - name: Save generated data on preview branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics-data
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified analytics data for preview'
            git push origin HEAD:build/premium-analytics
          fi
      - name: Package source for isolated browser tests
        run: git archive --format=zip HEAD -o /tmp/shua-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shua-source
          path: /tmp/shua-source.zip
          retention-days: 3
