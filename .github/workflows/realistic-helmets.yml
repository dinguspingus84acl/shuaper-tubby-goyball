name: Replace Helmets With Team Logos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/realistic-helmets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove helmets and keep team logos
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start = text.index('.helmet{')
          end = text.index('.stats{', start)
          logo_css = ".team-logo{width:190px;height:145px;flex:0 0 190px;display:flex;align-items:center;justify-content:center;margin-right:8px}.team-logo img{display:block;width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.42))}"
          text = text[:start] + logo_css + text[end:]

          old_fn = "function helmet(t){let s=teams[t];return `<div class=\"helmet\">${s?`<img src=\"https://a.espncdn.com/i/teamlogos/nfl/500/${s}.png\" alt=\"${t} team logo\">`:`<b>${t}</b>`}<span class=\"helmet-ear\"></span><span class=\"helmet-bumper\"></span></div>`}"
          new_fn = "function helmet(t){let s=teams[t];return `<div class=\"team-logo\">${s?`<img src=\"https://a.espncdn.com/i/teamlogos/nfl/500/${s}.png\" alt=\"${t} team logo\">`:`<b>${t}</b>`}</div>`}"
          if old_fn not in text:
              raise SystemExit('Current helmet function was not found')
          text = text.replace(old_fn, new_fn, 1)

          old_mobile = '.helmet{width:132px;height:92px;flex-basis:132px;margin-right:22px;padding:8px 34px 9px 12px;border-radius:68px 59px 40px 44px}.helmet img{width:70px;height:70px}.helmet:before{right:-31px;top:32px;width:52px;height:41px;border-width:6px}.helmet:after{right:-15px;width:39px;height:27px;border-width:6px}.helmet .helmet-ear{right:36px;bottom:15px;width:15px;height:15px;border-width:3px}.helmet .helmet-bumper{left:11px;bottom:8px;width:30px;height:9px}'
          new_mobile = '.team-logo{width:120px;height:92px;flex-basis:120px;margin-right:0}.team-logo img{width:82px;height:82px}'
          if old_mobile in text:
              text = text.replace(old_mobile, new_mobile, 1)
          else:
              marker = '.photo.lg{width:84px;height:84px}'
              text = text.replace(marker, marker + new_mobile, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove profile helmets and keep team logos"
          git push
