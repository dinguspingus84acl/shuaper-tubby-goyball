name: Apply Realistic Helmet Styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/realistic-helmets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make helmets more realistic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          desktop = ".helmet{position:relative;width:205px;height:145px;flex:0 0 205px;display:flex;align-items:center;justify-content:center;padding:12px 54px 15px 18px;background:radial-gradient(circle at 32% 19%,rgba(255,255,255,.98) 0 10%,rgba(255,255,255,.48) 11% 18%,transparent 19%),linear-gradient(140deg,#fff 0%,#f4f7fa 35%,#d8e0e9 68%,#98a6b6 100%);border:2px solid #263344;border-radius:105px 91px 61px 69px;margin-right:40px;box-shadow:inset 11px 13px 20px rgba(255,255,255,.92),inset -24px -19px 32px rgba(15,23,42,.25),0 15px 32px rgba(0,0,0,.4);transform:rotate(-1deg)}.helmet:before{content:'';position:absolute;right:-51px;top:49px;width:89px;height:69px;border:8px solid #0a1728;border-left:0;border-radius:0 42px 39px 0;transform:skewY(-7deg);box-shadow:inset -2px -2px 0 rgba(255,255,255,.12)}.helmet:after{content:'';position:absolute;right:-27px;bottom:3px;width:69px;height:47px;border-right:9px solid #0a1728;border-bottom:9px solid #0a1728;border-radius:0 0 29px 0;filter:drop-shadow(0 3px 2px rgba(0,0,0,.28))}.helmet img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.24));transform:translateX(-6px)}"
          text, count = re.subn(r'\.helmet\{position:relative;width:190px.*?\.helmet img\{width:104px;height:104px;object-fit:contain;filter:drop-shadow\(0 3px 4px rgba\(0,0,0,\.18\)\)\}', desktop, text, count=1)
          if count != 1:
              raise SystemExit('Desktop helmet CSS was not replaced')

          mobile = ".helmet{width:132px;height:92px;flex-basis:132px;margin-right:22px;padding:8px 34px 9px 12px;border-radius:68px 59px 40px 44px}.helmet img{width:70px;height:70px}.helmet:before{right:-31px;top:32px;width:52px;height:41px;border-width:6px}.helmet:after{right:-15px;width:39px;height:27px;border-width:6px}"
          text, count = re.subn(r'\.helmet\{width:120px;height:80px;flex-basis:120px.*?\.helmet:after\{right:-12px;width:34px;height:24px\}', mobile, text, count=1)
          if count != 1:
              raise SystemExit('Mobile helmet CSS was not replaced')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make player profile helmets more realistic"
          git push
