name: Verify Receiver Efficiency Heatmaps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'analytics/receiver-efficiency.js'
      - 'analytics/ui.js'
      - 'analytics/studio.css'
      - 'analytics/data/receiver-efficiency-2026.json'
      - 'tests/receiver-efficiency-browser.py'
      - '.github/workflows/receiver-efficiency-verify.yml'
permissions:
  contents: read
jobs:
  verify-receiver-efficiency:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Source and structural checks
        run: |
          node tests/receiver-efficiency.cjs
          node tests/analytics-core.cjs
          node --check analytics/receiver-efficiency.js
          node --check analytics/ui.js
      - name: Install Chrome for live UI simulation
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify 32-team charts on desktop and mobile
        run: python tests/receiver-efficiency-browser.py
