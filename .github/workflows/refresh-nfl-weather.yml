name: Refresh NFL weather forecasts

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh-nfl-weather.py'
      - '.github/workflows/refresh-nfl-weather.yml'
  schedule:
    # MySportsWeather is checked about every two hours, including game days.
    - cron: '23 */2 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: nfl-weather-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install HTML parser
        run: python -m pip install --disable-pip-version-check lxml==6.0.2
      - name: Validate weather extraction
        run: python tests/nfl-weather-refresh.py
      - name: Refresh MySportsWeather games and forecasts
        run: python -u scripts/refresh-nfl-weather.py
      - name: Validate new snapshot
        run: python tests/nfl-weather-refresh.py
      - name: Commit weather data if it changed
        id: save
        shell: bash
        run: |
          git config user.name 'SHUA Weather Updates'
          git config user.email 'actions@users.noreply.github.com'
          git add weather/data/nfl.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Refresh source-attributed NFL weather forecast data'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push raced with another update, retrying ($attempt/3)"
          done
          exit 1
      - name: Request Pages rebuild for automated update
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
