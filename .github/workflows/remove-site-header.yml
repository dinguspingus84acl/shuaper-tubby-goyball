name: Remove site header

on:
  push:
    paths:
      - '.github/workflows/remove-site-header.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove global SHUA header
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<header><div class="kick">SHUA RANKS · BIG BOARD</div><h1>2026 Fantasy<br>Overall Rankings</h1></header>'
          if old not in s:
              raise SystemExit('Header markup not found')
          s=s.replace(old,'',1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          ! grep -q 'SHUA RANKS · BIG BOARD' index.html
          ! grep -q '2026 Fantasy<br>Overall Rankings' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove global rankings header"
          git push
