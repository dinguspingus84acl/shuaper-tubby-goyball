name: Verify schedule header cleanup
on:
  push:
    branches: [feature/schedule-header-cleanup-20261018]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and calculation checks
        run: |
          node tests/analytics-core.cjs
          for f in analytics/*.js analytics-dashboard.js; do node --check "$f"; done
          python -m py_compile tests/studio-real-site.py tests/studio-entry.py
      - name: Install test browsers
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Test schedule UI in desktop and mobile browsers
        run: python tests/studio-real-site.py
      - name: Test routes and chart dropdown
        run: python tests/studio-entry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-header-preview
          path: tests/studio-verification/
          retention-days: 3
