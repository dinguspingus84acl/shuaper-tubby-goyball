name: Schedule UX preview
on:
  push:
    branches: [feature/schedule-player-box-20261018]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and test syntax
        run: |
          node tests/analytics-core.cjs
          for file in analytics/*.js analytics-dashboard.js; do node --check "$file"; done
          python -m py_compile tests/studio-real-site.py tests/studio-entry.py
      - name: Install Chromium and WebKit
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Test site and player boxes
        run: python tests/studio-real-site.py
      - name: Test chart navigation and recovery
        run: python tests/studio-entry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-ux-test-images
          path: tests/studio-verification/
          retention-days: 3
