name: Schedule week difficulty sorting preview
on:
  push:
    branches: [feature/compact-schedule-week-sort-20261018]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and calculations
        run: |
          node tests/analytics-core.cjs
          for file in analytics/*.js analytics-dashboard.js; do node --check "$file"; done
          python -m py_compile tests/studio-real-site.py tests/studio-entry.py
      - name: Install Chromium and WebKit
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Full site and schedule sorting regression
        run: python tests/studio-real-site.py
      - name: Analytics deep links and phone reload regression
        run: python tests/studio-entry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week-sort-browser-evidence
          path: tests/studio-verification/
          retention-days: 3
