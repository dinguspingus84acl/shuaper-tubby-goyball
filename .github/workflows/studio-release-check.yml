name: Analytics release preview
on:
  push:
    branches: ['verify/analytics-recovery-20261017']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Save exact checked-out source for verification
        run: |
          git archive --format=zip HEAD > /tmp/studio-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: studio-source
          path: /tmp/studio-source.zip
          retention-days: 3
      - name: Syntax and calculation tests
        run: |
          node tests/analytics-core.cjs
          for f in analytics/*.js analytics-dashboard.js player-insights.js; do node --check "$f"; done
      - name: Install verification browsers
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Browser regression tests
        run: python tests/studio-real-site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-report
          path: tests/studio-verification/
          retention-days: 3
