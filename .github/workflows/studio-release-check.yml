name: Analytics release preview
on:
  push:
    branches: ['verify/analytics-recovery-20261017']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare scoped dashboard release
        run: python scripts/prepare-studio-release.py
      - name: Syntax and calculation tests
        run: |
          node tests/analytics-core.cjs
          for f in analytics/*.js analytics-dashboard.js player-insights.js site-enhancements.js; do node --check "$f"; done
      - name: Install verification browsers
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Test all dashboards and existing navigation
        run: python tests/studio-real-site.py
      - name: Test direct links, chart expansion and interrupted-file recovery
        run: python tests/studio-entry.py
      - name: Save passing candidate to the verification branch only
        env:
          EXPECTED_BRANCH: verify/analytics-recovery-20261017
        run: |
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          git config user.name "SHUA Studio Verification"
          git config user.email "actions@users.noreply.github.com"
          git add analytics-dashboard.js analytics/charts.js analytics/studio.css analytics/ui.js index.html player-insights.js tests/studio-entry.py
          if ! git diff --cached --quiet; then
            git commit -m "Verified Studio release: direct links, polished expanded charts and reliable loading"
            git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
          fi
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Archive exact tested source
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/studio-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in Path('.').rglob('*'):
                  if p.is_file() and '.git' not in p.parts and 'studio-verification' not in p.parts:
                      z.write(p, str(p))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-source
          path: /tmp/studio-source.zip
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-report
          path: tests/studio-verification/
          retention-days: 3
