# expanded player cache
name: Update Dynasty player details

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dynasty-player-details.yml'

permissions:
  contents: write

concurrency:
  group: update-dynasty-player-details
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch player profile and trade-volume details
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from pathlib import Path

          rankings=json.loads(Path('dynasty-rankings.json').read_text())
          players=rankings.get('players') or []
          out={}
          history_out={}
          headers={'User-Agent':'Goyball dynasty cache/1.0','Accept':'application/json'}

          def get_json(url, attempts=3):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=20) as r:
                          return json.load(r)
                  except Exception as e:
                      last=e
                      time.sleep(.6*(i+1))
              raise last

          def fetch_player(p):
              nid=p.get('name_id')
              if not nid:
                  return None
              try:
                  data=get_json('https://dynasty-daddy.com/api/v1/player/details/'+nid)
              except Exception as e:
                  print('details skip',nid,type(e).__name__,e)
                  data={}
              try:
                  hist=get_json('https://dynasty-daddy.com/api/v1/player/'+nid+'?isAllTime=false')
              except Exception as e:
                  print('history skip',nid,type(e).__name__,e)
                  hist=[]
              profile=(data.get('profile') or []) if isinstance(data,dict) else []
              profile=profile[0] if profile and isinstance(profile[0],dict) else {}
              trade=data.get('tradeData') if isinstance(data,dict) and isinstance(data.get('tradeData'),dict) else {}
              detail={
                  'profile': profile,
                  'tradeVolume': trade.get('tradeVolume') if isinstance(trade,dict) else None,
                  'rostership': data.get('rostership') if isinstance(data,dict) and isinstance(data.get('rostership'),dict) else {},
              }
              clean=[]
              if isinstance(hist,list):
                  for row in hist:
                      if not isinstance(row,dict):
                          continue
                      clean.append({
                          'date':row.get('date'),
                          'trade_value':row.get('trade_value'),
                          'sf_trade_value':row.get('sf_trade_value'),
                          'position_rank':row.get('position_rank'),
                          'sf_position_rank':row.get('sf_position_rank'),
                      })
                  clean.sort(key=lambda x:str(x.get('date') or ''))
              return nid, detail, clean

          with ThreadPoolExecutor(max_workers=4) as pool:
              futures=[pool.submit(fetch_player,p) for p in players if p.get('name_id')]
              for idx,future in enumerate(as_completed(futures),1):
                  result=future.result()
                  if result:
                      nid,detail,clean=result
                      out[nid]=detail
                      history_out[nid]=clean
                  if idx%25==0:
                      print('fetched',idx,'of',len(futures))

          payload={
              'source':'Dynasty Daddy',
              'updated_at':datetime.now(timezone.utc).isoformat(),
              'players':out,
          }
          Path('dynasty-player-details.json').write_text(json.dumps(payload,separators=(',',':'))+'\n')
          history_payload={
              'source':'Dynasty Daddy',
              'updated_at':datetime.now(timezone.utc).isoformat(),
              'players':history_out,
          }
          Path('dynasty-history.json').write_text(json.dumps(history_payload,separators=(',',':'))+'\n')
          print('Wrote details for',len(out),'players and history for',len(history_out),'players')
          PY

      - name: Commit updated player details
        run: |
          if [ -z "$(git status --porcelain -- dynasty-player-details.json dynasty-history.json)" ]; then
            echo 'No Dynasty player detail changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dynasty-player-details.json dynasty-history.json
          git commit -m 'Update Dynasty player details'
          git pull --rebase origin main
          git push
