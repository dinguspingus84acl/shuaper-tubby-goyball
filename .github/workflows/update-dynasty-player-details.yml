name: Update Dynasty player details

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dynasty-player-details.yml'

permissions:
  contents: write

concurrency:
  group: update-dynasty-player-details
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch player profile and trade-volume details
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          rankings=json.loads(Path('dynasty-rankings.json').read_text())
          players=rankings.get('players') or []
          out={}
          headers={'User-Agent':'Goyball dynasty cache/1.0','Accept':'application/json'}

          def get_json(url, attempts=3):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=20) as r:
                          return json.load(r)
                  except Exception as e:
                      last=e
                      time.sleep(.6*(i+1))
              raise last

          for idx,p in enumerate(players,1):
              nid=p.get('name_id')
              if not nid:
                  continue
              try:
                  data=get_json('https://dynasty-daddy.com/api/v1/player/details/'+nid)
              except Exception as e:
                  print('skip',nid,type(e).__name__,e)
                  continue
              profile=(data.get('profile') or [])
              profile=profile[0] if profile and isinstance(profile[0],dict) else {}
              trade=data.get('tradeData') if isinstance(data.get('tradeData'),dict) else {}
              out[nid]={
                  'profile': profile,
                  'tradeVolume': trade.get('tradeVolume') if isinstance(trade,dict) else None,
                  'rostership': data.get('rostership') if isinstance(data.get('rostership'),dict) else {},
              }
              if idx%25==0:
                  print('fetched',idx,'of',len(players))
              time.sleep(.05)

          payload={
              'source':'Dynasty Daddy',
              'updated_at':datetime.now(timezone.utc).isoformat(),
              'players':out,
          }
          Path('dynasty-player-details.json').write_text(json.dumps(payload,separators=(',',':'))+'\n')
          print('Wrote details for',len(out),'players')
          PY

      - name: Commit updated player details
        run: |
          if [ -z "$(git status --porcelain -- dynasty-player-details.json)" ]; then
            echo 'No Dynasty player detail changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dynasty-player-details.json
          git commit -m 'Update Dynasty player details'
          git push
