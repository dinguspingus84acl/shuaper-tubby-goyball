name: Update QB colors

on:
  push:
    paths:
      - '.github/workflows/update-qb-colors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply QB My Guys and Do Not Draft lists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          my_guys = {
              'Justin Herbert',
              'Trevor Lawrence',
              'Caleb Williams',
              'Brock Purdy',
              'Baker Mayfield',
              'Kyler Murray',
              'Bo Nix',
              'Tyler Shough',
              'Jared Goff',
              'Malik Willis',
          }
          do_not_draft = {
              'Jaxson Dart',
              'Patrick Mahomes',
              'J.J. McCarthy',
          }

          qb_path = Path('qb-rankings.json')
          qb = json.loads(qb_path.read_text())
          for player in qb.get('players', []):
              name = player.get('name', '')
              if name in my_guys:
                  player['tag'] = 'draft'
              elif name in do_not_draft:
                  player['tag'] = 'do-not-draft'
              else:
                  player['tag'] = ''
          qb_path.write_text(json.dumps(qb, ensure_ascii=False, separators=(',', ':')))

          colors_path = Path('player-color-tags.json')
          colors = json.loads(colors_path.read_text())
          colors['QB'] = {
              'do-not-draft': ['Jaxson Dart', 'Patrick Mahomes', 'J.J. McCarthy'],
              'draft': ['Justin Herbert', 'Trevor Lawrence', 'Caleb Williams', 'Brock Purdy', 'Baker Mayfield', 'Kyler Murray', 'Bo Nix', 'Tyler Shough', 'Jared Goff', 'Malik Willis']
          }
          colors_path.write_text(json.dumps(colors, ensure_ascii=False, separators=(',', ':')))
          PY
      - name: Commit QB color update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qb-rankings.json player-color-tags.json
          git commit -m "Update QB My Guys and Do Not Draft colors"
          git push
