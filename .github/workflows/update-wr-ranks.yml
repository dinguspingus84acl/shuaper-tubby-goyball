name: Update WR ranks

on:
  push:
    paths:
      - '.github/workflows/update-wr-ranks.yml'
      - '.wr-import-data.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode WR source
        run: |
          base64 -d .wr-import-data.b64 | gzip -d > /tmp/wr.csv
      - name: Import updated WR rankings
        run: |
          python - <<'PY'
          import csv, json, re
          from pathlib import Path

          with open('/tmp/wr.csv', encoding='cp1252', newline='') as f:
              rows=list(csv.DictReader(f))

          colors=json.loads(Path('player-color-tags.json').read_text())
          draft=set(colors.get('WR',{}).get('draft',[]))
          dnd=set(colors.get('WR',{}).get('do-not-draft',[]))

          def norm(s):
              return re.sub(r'[^a-z0-9]','',str(s).lower())
          alias={norm('Pat Byrnat'):norm('Pat Bryant')}
          draft_n={alias.get(norm(x),norm(x)) for x in draft}
          dnd_n={alias.get(norm(x),norm(x)) for x in dnd}

          players=[]
          for row in rows:
              name=row['Player'].strip()
              team=row['Team'].strip()
              if name=='A.J. Brown':
                  team='NWE'
              adp=row['ESPN ADP'].strip()
              if adp:
                  try:
                      v=float(adp)
                      if v.is_integer():
                          v=int(v)
                          adp=('+'+str(v)) if v>0 else str(v)
                  except ValueError:
                      pass
              key=alias.get(norm(name),norm(name))
              tag='draft' if key in draft_n else ('do-not-draft' if key in dnd_n else '')
              players.append({
                  'rank':int(row['Rank']),
                  'name':name,
                  'team':team,
                  'espnAdp':adp,
                  'notes':row['Notes'].strip(),
                  'tag':tag
              })

          assert len(players)==131
          assert [p['rank'] for p in players]==list(range(1,132))
          Path('wr-rankings.json').write_text(json.dumps({'position':'WR','players':players},ensure_ascii=False,separators=(',',':')))
          PY
      - name: Commit WR update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wr-rankings.json
          git diff --cached --quiet || git commit -m "Import updated WR rankings"
          git push
