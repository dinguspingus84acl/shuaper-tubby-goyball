name: Validate site enhancements

on:
  push:
    paths:
      - '.github/workflows/validate-site-enhancements.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check site-enhancements.js
