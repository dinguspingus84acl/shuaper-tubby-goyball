<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-label="Fantasy">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#0a0c31"/>
      <stop offset="0.55" stop-color="#02051d"/>
      <stop offset="1" stop-color="#010315"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1717"/>
      <stop offset="0.38" stop-color="#ff005a"/>
      <stop offset="0.62" stop-color="#bd18ff"/>
      <stop offset="1" stop-color="#008cff"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff311f"/>
      <stop offset="0.5" stop-color="#ff003d"/>
      <stop offset="1" stop-color="#d50983"/>
    </linearGradient>
    <linearGradient id="blue" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00a6ff"/>
