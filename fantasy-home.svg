    <path d="M0 330 L-292 -176 L292 -176 Z" stroke="url(#blue)" stroke-width="64"/>
  </g>
  <g transform="translate(627 442)" fill="none" stroke-linecap="square" stroke-linejoin="miter" opacity="0.95">
