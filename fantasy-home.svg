  </g>
  <text x="627" y="1048" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="176" font-style="italic" font-weight="900" letter-spacing="-8" fill="url(#neon)" filter="url(#soft)">FANTASY</text>
  <text x="627" y="1048" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="176" font-style="italic" font-weight="900" letter-spacing="-8" fill="url(#neon)">FANTASY</text>
