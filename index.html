<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHUA 2026 Fantasy Rankings</title>
<style>
:root{--bg:#061322;--panel:#0b2139;--text:#f8fafc;--muted:#91a4ba;--red:#ff1744;--green:#35d07f;--line:rgba(150,180,210,.17);--qb:#b28bd4;--rb:#79c8ad;--wr:#53a6cf;--te:#d39a49}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:radial-gradient(circle at 90% 0,#501430 0,transparent 31%),linear-gradient(145deg,#061322,#071c31);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}header{max-width:1500px;margin:auto;padding:30px 22px 20px;border-bottom:3px solid var(--red)}.kick{color:var(--red);letter-spacing:.3em;font-weight:900;font-size:.75rem}h1{font-size:clamp(2.6rem,6vw,5.6rem);line-height:.9;margin:12px 0;font-style:italic}.sticky{position:sticky;top:0;z-index:20;background:rgba(5,18,32,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.tools{max-width:1500px;margin:auto;padding:12px 22px;display:grid;grid-template-columns:minmax(250px,1fr) auto;gap:12px}.search{position:relative}.search input{width:100%;height:46px;border:0;border-radius:10px;padding:0 44px 0 15px;color:#101827;font-weight:700}.clear{position:absolute;right:8px;top:7px;width:32px;height:32px;border:0;border-radius:8px;display:none}.positions,.team-options,.mock-actions,.mock-filters{display:flex;gap:7px;flex-wrap:wrap}.pos,.team-btn,.mock-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:9px 13px;font-weight:900;cursor:pointer}.pos.active,.team-btn.active,.mock-btn.primary{background:#183d63;color:white}.mock-btn.danger{border-color:#7f1d1d;color:#fecaca}.mock-btn:disabled{opacity:.45;cursor:not-allowed}main{max-width:1500px;margin:auto;padding:20px 22px 60px}.head{margin:5px 0 12px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}.head h2{margin:0;font-size:1.7rem}.head small{color:var(--muted)}.board{display:grid;gap:4px}.pick{min-height:82px;border-radius:9px;padding:8px 9px;color:#061322;position:relative;cursor:pointer;border:2px solid rgba(0,0,0,.2);overflow:hidden}.pick:hover{filter:brightness(1.07);transform:translateY(-1px)}.pick.rb,.drafted.rb{background:var(--rb)}.pick.wr,.drafted.wr{background:var(--wr)}.pick.te,.drafted.te{background:var(--te)}.pick.qb,.drafted.qb{background:var(--qb)}.pick .top{display:block;padding-right:28px;min-width:0}.pick .name{display:block;width:100%;font-size:.92rem;font-weight:950;line-height:1.05;white-space:nowrap;overflow:visible;letter-spacing:-.02em}.pick .slot{position:absolute;right:8px;top:8px;font-size:.72rem;opacity:.65;font-weight:900}.pick .meta{font-size:.72rem;font-weight:850;margin-top:4px}.pick .arrow{position:absolute;left:8px;bottom:5px;font-weight:950}.card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:rgba(9,28,48,.87)}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;padding:12px 14px;background:#0b2037}td{padding:13px 14px;border-top:1px solid var(--line);vertical-align:top}tbody tr{cursor:pointer}tbody tr:hover{background:#102c4b}.rank{font-size:1.25rem;color:var(--red);font-weight:950}.badge{display:inline-flex;padding:5px 7px;border-radius:5px;background:#22517e;font-size:.72rem;font-weight:900}.adp{font-weight:900}.notes{max-width:520px;line-height:1.4;color:#d7e1ec}.draft-name{color:var(--green)}.do-not-draft-name{color:var(--red)}.suggestions{position:absolute;left:0;right:0;top:51px;background:#fff;color:#172033;border-radius:12px;box-shadow:0 20px 50px #0008;display:none;max-height:390px;overflow-y:auto}.sug{padding:11px 13px;border-bottom:1px solid #e7ebf0;display:flex;justify-content:space-between;cursor:pointer}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.profile{width:min(760px,100%);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#102c4c,#071827);border:1px solid var(--line);border-radius:18px}.ph{padding:24px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.ph h3{font-size:2.4rem;margin:4px 0}.closem{width:40px;height:40px;border:1px solid var(--line);background:transparent;color:white;border-radius:9px}.pb{padding:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.note-box{border:1px solid var(--line);border-radius:10px;padding:12px}.stat span,.note-box span{display:block;color:var(--muted);font-size:.7rem}.stat b{font-size:1.25rem;display:block;margin-top:4px}.note-box{margin-top:16px}.empty{padding:50px;text-align:center;color:var(--muted)}
.mock-setup{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr)) auto;gap:12px;align-items:end;padding:16px;margin-bottom:14px}.mock-setup label{display:grid;gap:6px;color:var(--muted);font-size:.8rem;font-weight:800}.mock-setup select{width:100%;border:1px solid var(--line);background:#081a2d;color:white;border-radius:9px;padding:10px}.mock-status{padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:#081a2d}.mock-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.7fr);gap:14px}.draft-board{display:grid;gap:4px;overflow-x:auto;padding-bottom:6px}.drafted{min-width:125px;min-height:72px;border-radius:8px;padding:7px;color:#061322;border:2px solid rgba(0,0,0,.2);position:relative}.drafted.empty-slot{background:#0d2945;color:var(--muted);border:1px dashed #315474}.drafted.user-pick{box-shadow:inset 0 0 0 3px #fff}.drafted .slot{font-size:.68rem;font-weight:900;opacity:.68}.drafted .name{font-size:.82rem;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.drafted .team{font-size:.67rem;font-weight:800}.player-pool{border:1px solid var(--line);border-radius:12px;background:#081a2d;overflow:hidden}.pool-head{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:9px}.pool-list{max-height:620px;overflow:auto}.pool-player{width:100%;display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:white;cursor:pointer}.pool-player:hover{background:#102c4b}.pool-player:disabled{opacity:.55;cursor:not-allowed}.pool-rank{color:var(--red);font-weight:900}.pool-meta{color:var(--muted);font-size:.75rem}.on-clock{color:#86efac;font-weight:900}.roster{margin-top:14px}.roster-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.roster-card{border:1px solid var(--line);border-radius:9px;padding:9px;background:#081a2d}.roster-card b{display:block;margin-bottom:4px}.roster-card span{color:var(--muted);font-size:.8rem}
@media(max-width:1000px){.mock-layout{grid-template-columns:1fr}.mock-setup{grid-template-columns:1fr 1fr}.roster-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:900px){.tools{grid-template-columns:1fr}.positions{overflow-x:auto}.stats{grid-template-columns:1fr 1fr}}@media(max-width:650px){header,.tools,main{padding-left:12px;padding-right:12px}table,thead,tbody,tr,td{display:block}thead{display:none}tbody{display:grid;gap:9px;padding:9px}tbody tr{border:1px solid var(--line);border-radius:11px;padding:12px}.notes{margin-top:8px}.pick{min-width:128px}.board{overflow-x:auto}.mock-setup{grid-template-columns:1fr}.roster-grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="kick">SHUA RANKS · BIG BOARD</div><h1>2026 Fantasy<br>Overall Rankings</h1></header>
<div class="sticky"><div class="tools"><div class="search"><input id="search" placeholder="Search for a player…" autocomplete="off"><button class="clear" id="clear">×</button><div class="suggestions" id="suggestions"></div></div><div class="positions"><button class="pos active" data-pos="ALL">Overall</button><button class="pos" data-pos="QB">QB</button><button class="pos" data-pos="RB">RB</button><button class="pos" data-pos="WR">WR</button><button class="pos" data-pos="TE">TE</button><button class="pos" data-pos="MOCK">Mock Draft</button></div></div></div>
<main>
<div class="head"><div><h2 id="title">My SHUA Big Board</h2><small id="sub"></small></div><div id="teamControls" class="team-options"><button class="team-btn active" data-teams="10">10 Man</button><button class="team-btn" data-teams="12">12 Man</button><button class="team-btn" data-teams="14">14 Man</button></div></div>
<div id="board" class="board"></div>
<div id="tableCard" class="card" hidden><table><thead><tr><th>Rank</th><th>Player</th><th>Position</th><th>Team</th><th>ESPN ADP</th><th>Notes</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>No players found.</div></div>
<section id="mockSection" hidden>
<div class="card mock-setup"><label>Teams<select id="mockTeams"><option>10</option><option>12</option><option>14</option></select></label><label>Your draft slot<select id="mockSlot"></select></label><label>Rounds<select id="mockRounds"><option>6</option><option selected>10</option><option>12</option><option>15</option></select></label><button id="startMock" class="mock-btn primary">Start Mock Draft</button></div>
<div id="mockStatus" class="mock-status">Choose your settings and start the draft.</div>
<div class="mock-actions"><button id="undoPick" class="mock-btn" disabled>Undo</button><button id="resetMock" class="mock-btn danger" disabled>Reset Draft</button><button id="autoToUser" class="mock-btn" disabled>Sim to My Pick</button></div>
<div class="mock-layout">
<div><div id="draftBoard" class="draft-board"></div><div class="roster"><h3>My Team</h3><div id="myRoster" class="roster-grid"></div></div></div>
<div class="player-pool"><div class="pool-head"><input id="poolSearch" placeholder="Search available players…"><div class="mock-filters"><button class="mock-btn pool-filter primary" data-filter="ALL">All</button><button class="mock-btn pool-filter" data-filter="QB">QB</button><button class="mock-btn pool-filter" data-filter="RB">RB</button><button class="mock-btn pool-filter" data-filter="WR">WR</button><button class="mock-btn pool-filter" data-filter="TE">TE</button></div></div><div id="poolList" class="pool-list"></div></div>
</div></section>
</main>
<div class="modal" id="modal"><div class="profile"><div class="ph"><div><small>PLAYER PROFILE</small><h3 id="pn"></h3><div id="pm"></div></div><button class="closem" id="close">×</button></div><div class="pb"><div class="stats" id="stats"></div><div class="note-box"><span>Your notes</span><p id="playerNotes"></p></div></div></div></div>
<script>
let board=[],players=[],position="ALL",teamCount=10;
let mock={active:false,teams:10,slot:1,rounds:10,picks:[],filter:"ALL",search:""};
const $=s=>document.querySelector(s);
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}
function shortName(name){const p=String(name).trim().split(/\s+/);return p.length<2?name:p[0][0]+". "+p.slice(1).join(" ")}
function fitBoardNames(){document.querySelectorAll(".pick .name").forEach(el=>{let z=.92;el.style.fontSize=z+"rem";while(el.scrollWidth>el.clientWidth&&z>.56){z-=.02;el.style.fontSize=z+"rem"}})}
function custom(rows,pos){return(rows||[]).map(x=>({id:pos.toLowerCase()+"-"+x.rank+"-"+norm(x.name),name:x.name,team:x.team||"—",position:pos,positionRank:x.rank,additionalStats:{espnAdp:x.espnAdp||"",notes:x.notes||"",tag:x.tag||""}}))}
async function load(){try{const urls=["big-board.json","players.json","qb-rankings.json","rb-rankings.json","wr-rankings.json","te-rankings.json"];const rs=await Promise.all(urls.map(u=>fetch(u,{cache:"no-store"})));if(rs.some(r=>!r.ok))throw Error("Could not load ranking files");const[b,p,q,r,w,t]=await Promise.all(rs.map(x=>x.json()));players=p.filter(x=>!["QB","RB","WR","TE"].includes(x.position)).concat(custom(q.players,"QB"),custom(r.players,"RB"),custom(w.players,"WR"),custom(t.players,"TE"));const byName=new Map(players.map(x=>[norm(x.name),x]));board=(b.players||[]).map((name,i)=>{const x=byName.get(norm(name));return x?{...x,overallRank:i+1}:{id:"missing-"+i,name,team:"—",position:"—",positionRank:"—",overallRank:i+1,missing:true,additionalStats:{}}});render();syncMockSlotOptions();renderPool()}catch(e){$("#board").innerHTML=`<div class="empty">${e.message}</div>`}}
function current(){return position==="ALL"?board:players.filter(p=>p.position===position).sort((a,b)=>a.positionRank-b.positionRank)}
function nameClass(p){const t=(p.additionalStats||{}).tag;return t==="draft"?"draft-name":t==="do-not-draft"?"do-not-draft-name":""}
function render(){const isOverall=position==="ALL",isMock=position==="MOCK",list=current();$("#title").textContent=isMock?"Interactive Mock Draft":isOverall?"My SHUA Big Board":position+" Rankings";$("#sub").textContent=isOverall?teamCount+"-team snake draft":isMock?"Draft against computer teams using your rankings":"";$("#teamControls").hidden=!isOverall;$("#board").hidden=!isOverall;$("#tableCard").hidden=isOverall||isMock;$("#mockSection").hidden=!isMock;if(isOverall){$("#board").style.gridTemplateColumns=`repeat(${teamCount},minmax(125px,1fr))`;$("#board").innerHTML=list.map((p,i)=>{const r=Math.floor(i/teamCount)+1,o=i%teamCount,s=r%2?o+1:teamCount-o,a=r%2?"→":"←";return`<div class="pick ${String(p.position).toLowerCase()}" data-id="${p.id}"><div class="top"><div class="name">${shortName(p.name)}</div><div class="slot">${r}.${s}</div></div><div class="meta">${p.position} · ${p.team}</div><div class="arrow">${a}</div></div>`}).join("");requestAnimationFrame(fitBoardNames)}else if(!isMock){$("#rows").innerHTML=list.map(p=>{const a=p.additionalStats||{};return`<tr data-id="${p.id}"><td class="rank">#${p.positionRank}</td><td><b class="${nameClass(p)}">${p.name}</b></td><td><span class="badge">${p.position}</span></td><td>${p.team}</td><td class="adp">${a.espnAdp||"—"}</td><td class="notes">${a.notes||"—"}</td></tr>`}).join("");$("#empty").hidden=!!list.length}document.querySelectorAll("[data-id]").forEach(r=>r.onclick=()=>profile(r.dataset.id));if(isMock){renderMock()}}
document.querySelectorAll(".pos").forEach(b=>b.onclick=()=>{position=b.dataset.pos;document.querySelectorAll(".pos").forEach(x=>x.classList.toggle("active",x===b));render()});
document.querySelectorAll(".team-btn").forEach(b=>b.onclick=()=>{teamCount=Number(b.dataset.teams);document.querySelectorAll(".team-btn").forEach(x=>x.classList.toggle("active",x===b));render()});
function profile(id){const p=players.find(x=>x.id===id)||board.find(x=>x.id===id);if(!p||p.missing)return;const a=p.additionalStats||{},overall=board.findIndex(x=>norm(x.name)===norm(p.name))+1;$("#pn").textContent=p.name;$("#pn").className=nameClass(p);$("#pm").textContent=`${p.team} · ${p.position}`;$("#stats").innerHTML=`${overall>0?`<div class="stat"><span>Overall rank</span><b>#${overall}</b></div>`:""}<div class="stat"><span>Position</span><b>${p.position}</b></div><div class="stat"><span>Position rank</span><b>#${p.positionRank}</b></div><div class="stat"><span>ESPN ADP</span><b>${a.espnAdp||"—"}</b></div>`;$("#playerNotes").textContent=a.notes||"No notes provided.";$("#modal").classList.add("open")}
$("#close").onclick=()=>$("#modal").classList.remove("open");$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("open")};
$("#search").oninput=()=>{const q=norm($("#search").value);$("#clear").style.display=q?"block":"none";if(!q){$("#suggestions").style.display="none";return}const hits=players.filter(p=>norm(p.name).includes(q)).slice(0,10);$("#suggestions").innerHTML=hits.length?hits.map(p=>`<div class="sug" data-sid="${p.id}"><span><b class="${nameClass(p)}">${p.name}</b><br><small>${p.position} #${p.positionRank} · ${p.team}</small></span></div>`).join(""):'<div class="sug">No players found</div>';$("#suggestions").style.display="block";document.querySelectorAll("[data-sid]").forEach(x=>x.onmousedown=e=>{e.preventDefault();profile(x.dataset.sid);$("#suggestions").style.display="none"})};$("#clear").onclick=()=>{$("#search").value="";$("#clear").style.display="none";$("#suggestions").style.display="none"};

function syncMockSlotOptions(){const n=Number($("#mockTeams").value||10),old=Number($("#mockSlot").value||1);$("#mockSlot").innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join("");$("#mockSlot").value=Math.min(old,n)}
$("#mockTeams").addEventListener("change",syncMockSlotOptions);
function snakeTeamForPick(i,teams){const round=Math.floor(i/teams)+1,offset=i%teams;return round%2?offset+1:teams-offset}
function slotLabel(i,teams){const r=Math.floor(i/teams)+1,o=i%teams;return`${r}.${r%2?o+1:teams-o}`}
function availablePlayers(){const used=new Set(mock.picks.map(x=>x.player.id));return board.filter(p=>!p.missing&&!used.has(p.id))}
function startMock(){mock={active:true,teams:Number($("#mockTeams").value),slot:Number($("#mockSlot").value),rounds:Number($("#mockRounds").value),picks:[],filter:"ALL",search:""};$("#poolSearch").value="";renderMock();simUntilUser()}
function simUntilUser(){if(!mock.active)return;while(mock.picks.length<mock.teams*mock.rounds&&snakeTeamForPick(mock.picks.length,mock.teams)!==mock.slot){cpuPick()}renderMock()}
function cpuPick(){const p=availablePlayers()[0];if(!p)return;mock.picks.push({player:p,team:snakeTeamForPick(mock.picks.length,mock.teams),cpu:true})}
function userPick(id){if(!mock.active||snakeTeamForPick(mock.picks.length,mock.teams)!==mock.slot)return;const p=availablePlayers().find(x=>x.id===id);if(!p)return;mock.picks.push({player:p,team:mock.slot,cpu:false});simUntilUser()}
function renderMock(){const total=mock.teams*mock.rounds,pickIndex=mock.picks.length,onClock=mock.active&&pickIndex<total?snakeTeamForPick(pickIndex,mock.teams):null;$("#undoPick").disabled=!mock.picks.length;$("#resetMock").disabled=!mock.active;$("#autoToUser").disabled=!mock.active||onClock===mock.slot;if(!mock.active){$("#draftBoard").innerHTML="";$("#myRoster").innerHTML="";$("#mockStatus").textContent="Choose your settings and start the draft.";renderPool();return}$("#mockStatus").innerHTML=pickIndex>=total?"Draft complete.":onClock===mock.slot?`<span class="on-clock">You are on the clock — pick ${slotLabel(pickIndex,mock.teams)}</span>`:`Computer team ${onClock} is on the clock.`;$("#draftBoard").style.gridTemplateColumns=`repeat(${mock.teams},minmax(125px,1fr))`;$("#draftBoard").innerHTML=Array.from({length:total},(_,i)=>{const d=mock.picks[i],team=snakeTeamForPick(i,mock.teams);if(!d)return`<div class="drafted empty-slot"><div class="slot">${slotLabel(i,mock.teams)} · Team ${team}</div></div>`;const p=d.player;return`<div class="drafted ${String(p.position).toLowerCase()} ${d.team===mock.slot?"user-pick":""}"><div class="slot">${slotLabel(i,mock.teams)} · Team ${d.team}</div><div class="name">${shortName(p.name)}</div><div class="team">${p.position} · ${p.team}</div></div>`}).join("");const mine=mock.picks.filter(x=>x.team===mock.slot).map(x=>x.player);$("#myRoster").innerHTML=mine.length?mine.map(p=>`<div class="roster-card"><b>${p.name}</b><span>${p.position} · ${p.team}</span></div>`).join(""):'<div class="empty">No players drafted yet.</div>';renderPool()}
function renderPool(){if(!board.length)return;const canPick=mock.active&&snakeTeamForPick(mock.picks.length,mock.teams)===mock.slot;const q=norm(mock.search),list=availablePlayers().filter(p=>(mock.filter==="ALL"||p.position===mock.filter)&&(!q||norm(p.name).includes(q))).slice(0,120);$("#poolList").innerHTML=list.map(p=>`<button class="pool-player" data-pick="${p.id}" ${canPick?"":"disabled"}><span class="pool-rank">#${p.overallRank}</span><span><b class="${nameClass(p)}">${p.name}</b><div class="pool-meta">${p.position} #${p.positionRank} · ${p.team}</div></span><span>Draft</span></button>`).join("")||'<div class="empty">No available players.</div>';document.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>userPick(b.dataset.pick)))}
$("#startMock").onclick=startMock;$("#undoPick").onclick=()=>{if(mock.picks.length){mock.picks.pop();renderMock()}};$("#resetMock").onclick=()=>{mock.active=false;mock.picks=[];renderMock()};$("#autoToUser").onclick=()=>simUntilUser();$("#poolSearch").oninput=e=>{mock.search=e.target.value;renderPool()};document.querySelectorAll(".pool-filter").forEach(b=>b.onclick=()=>{mock.filter=b.dataset.filter;document.querySelectorAll(".pool-filter").forEach(x=>x.classList.toggle("primary",x===b));renderPool()});
window.addEventListener("resize",()=>{if(position==="ALL")fitBoardNames()});load();
</script></body></html>
