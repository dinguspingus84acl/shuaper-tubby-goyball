  const proj=weeklyProjection(p,leagueFor(snapshot.id)?.week||7);
  const bye=archive?null:byeWeeks[String(p.nfl||'').toUpperCase()];
  const byeLabel=bye===(leagueFor(snapshot.id)?.week||7)?'<span class="myteams-bye is-now">BYE</span>':'';
  return '<div class="myteams-roster-row" data-myteams-player="'+escapeHtml(p.name||'')+'" data-myteams-player-id="'+escapeHtml(p.id||'')+'" data-myteams-player-pos="'+escapeHtml(p.pos||'')+'" data-myteams-player-team="'+escapeHtml(p.nfl||'')+'" role="button" tabindex="0"><span class="myteams-slot">'+escapeHtml(p.slot||'—')+'</span><div class="myteams-player"><button type="button" class="myteams-player-open">'+faceImg+'<span><b>'+escapeHtml(p.name||'Unknown')+'</b><small>'+(dst?'':nflLogo(p.nfl))+escapeHtml(dst?'D/ST · ':'')+escapeHtml(p.nfl||'FA')+' '+byeLabel+(status?' <em class="myteams-injury">'+escapeHtml(status)+'</em>':'')+'</small></span></button></div><strong title="'+(proj==='—'?'ESPN weekly projection unavailable':'ESPN weekly projection')+'">'+proj+'</strong></div>';
 }).join('');
};
const leagueFor=id=>leagueData.find(x=>x.id===id);
function standingsTable(standings){
 if(!standings.length)return '<p class="myteams-empty">Standings unavailable.</p>';
 const sorted=[...standings].sort((a,b)=>(a.rank??99)-(b.rank??99));
 const row=t=>'<div class="myteams-standings-line"><span class="myteams-rank">'+escapeHtml(t.rank??'—')+'</span><button class="myteams-team-open" type="button" data-myteams-team="'+escapeHtml(t.teamId??'')+'">'+fantasyLogo(t)+'<span>'+escapeHtml(t.teamName||'Unknown')+'</span></button><span>'+escapeHtml((t.wins??'—')+'–'+(t.losses??'—')+'–'+(t.ties??0))+'</span><span>'+fmt(t.pointsFor)+'</span><span>'+fmt(t.pointsAgainst)+'</span></div>';
 return '<div class="myteams-compact-list"><div class="myteams-standings-line is-heading"><span>#</span><span>Team</span><span>W–L–T</span><span>PF</span><span>PA</span></div>'+sorted.map(row).join('')+'</div>';
}
function standingHtml(id){return standingsTable(leagueFor(id)?.standings||[]);}
function otherTeamHtml(item,teamId){
 const entry=item.year===2026?opponentRosters.find(x=>x.id===item.id&&String(x.teamId)===String(teamId)):null;
 const title=entry?.teamName||leagueFor(item.id)?.standings?.find(x=>String(x.teamId)===String(teamId))?.teamName||'Team';
 const own=item.year===2026&&String(item.teamId)===String(teamId)?rosterSnapshots[item.index]:null;
 const roster=own?.roster||entry?.roster;
 return '<button type="button" class="myteams-back" data-myteams-back>← Back</button><h3 style="margin:3px 0 9px">'+escapeHtml(title)+'</h3>'+(roster?.length?rosterHtml(-1,{roster}):'<p class="myteams-empty">Current roster snapshot unavailable for this team.</p>');
}
function matchupHtml(id){
 const l=leagueFor(id),matches=l?.matchups||[];
 if(!matches.length)return '<p class="myteams-empty">Matchups unavailable.</p>';
 return '<p class="myteams-data-caption">Week '+escapeHtml(l.week||'current')+' · ESPN snapshot</p>'+matches.map(m=>{
 const side=(t)=>'<button class="myteams-team-open" type="button" data-myteams-team="'+escapeHtml(t?.teamId??'')+'">'+escapeHtml(t?.teamName||'—')+'</button><strong>'+fmt(t?.currentPoints??t?.totalPoints)+'</strong>';
 return '<div class="myteams-match"><div>'+side(m.home)+'</div><small>VS</small><div>'+side(m.away)+'</div></div>';
 }).join('');
}
function wireHtml(id,position='ALL'){
 const injuryMap=waiverInjuries.find(x=>x.id===id)?.players||{};
 const players=(waiverData.find(x=>x.id===id)?.players||[]).filter(p=>{
  if(!['free_agent','waivers'].includes(String(p.acquisitionState||'').toLowerCase()))return false;
  const injury=injuryMap[String(p.id)];
  return !(p.seasonEnding===true||/season.end/i.test(String(p.status||''))||(injury?.status==='IR'&&Number(injury.seasonProjection)===0));
 });
 if(!players.length)return '<p class="myteams-empty">Waiver-wire data unavailable.</p>';
 const choices=['ALL','QB','RB','WR','TE','K','D/ST'];
 const week=leagueFor(id)?.week||7;
 const eligible=players.filter(p=>position==='ALL'||p.position===position);
 const hasProjections=eligible.some(p=>weeklyProjection(p,week)!=='—');
 if(hasProjections)eligible.sort((a,b)=>(Number(weeklyProjection(b,week))||-1)-(Number(weeklyProjection(a,week))||-1));
 const leaders=hasProjections?eligible.filter(p=>weeklyProjection(p,week)!=='—').slice(0,10):eligible.slice(0,10);
 return '<p class="myteams-data-caption">Week '+week+' · '+(hasProjections?'Top available players by ESPN weekly projection':'Available players · weekly projections unavailable')+'</p><div class="myteams-wire-positions">'+choices.map(k=>'<button type="button" data-myteams-wire-pos="'+k+'" aria-pressed="'+(position===k)+'">'+k+'</button>').join('')+'</div>'+(!leaders.length?'<p class="myteams-empty">No available '+escapeHtml(position)+' players in this snapshot.</p>':'<div class="myteams-compact-list"><div class="myteams-wire-line myteams-standings-line is-heading"><span>#</span><span>Player</span><span>Pos</span><span>Proj.</span><span>Status</span></div>'+leaders.map((p,i)=>{
 const status=p.acquisitionState==='waivers'?'Waivers':'FA';
 const dst=p.position==='D/ST';
 const head=dst?'<span class="myteams-defense-badge">'+nflLogo(p.team)+'</span>':p.id?'<img loading="lazy" src="https://a.espncdn.com/i/headshots/nfl/players/full/'+encodeURIComponent(p.id)+'.png" alt="" onerror="this.style.display=\'none\'">':'';
 return '<div class="myteams-wire-line"><span>'+(i+1)+'</span><button class="myteams-player-open" type="button" data-myteams-player="'+escapeHtml(p.name||'')+'" data-myteams-player-id="'+escapeHtml(p.id||'')+'" data-myteams-player-pos="'+escapeHtml(p.position||'')+'" data-myteams-player-team="'+escapeHtml(p.team||'')+'">'+head+'<span><b>'+escapeHtml(p.name||'Unknown')+'</b><small>'+(dst?'':nflLogo(p.team))+escapeHtml(p.team||'FA')+'</small></span></button><span>'+escapeHtml(p.position||'—')+'</span><span>'+weeklyProjection(p,week)+'</span><span><span class="myteams-acquire">'+status+'</span></span></div>';
 }).join('')+'</div>');
}
function historyFinish(item){
 const archive=historicalData.find(x=>x.id===item.id&&x.year===item.year&&x.teamId===String(item.teamId));
 const result=archive?.standings?.find(x=>String(x.teamId)===String(item.teamId));
 if(!result)return 'Finish unavailable';
 if(result.championshipWon===true||result.finalRank===1)return '🏆 Champion';
 if(result.finalRank!=null)return 'Finished #'+result.finalRank;
 return result.rank!=null?'Standings #'+result.rank+' · final finish unverified':'Finish unavailable';
}
function scheduleHtml(item){
 if(item.year!==2026)return '<p class="myteams-empty">Historical schedule not loaded.</p>';
 const records=scheduleData.filter(x=>x.id===item.id);
 const liveWeek=leagueFor(item.id)?.week||7;
 if(!records.some(x=>x.week===liveWeek))records.push({id:item.id,week:liveWeek,matchups:leagueFor(item.id)?.matchups||[]});
 records.sort((a,b)=>a.week-b.week);
 const tid=String(item.teamId);
 return '<div class="myteams-schedule">'+records.map(w=>{
  const match=w.matchups.find(m=>String(m.home?.teamId)===tid||String(m.away?.teamId)===tid);
  if(!match)return '';
  const mine=String(match.home?.teamId)===tid?match.home:match.away;
  const opp=mine===match.home?match.away:match.home;
  const score=Number(mine?.currentPoints??mine?.totalPoints),against=Number(opp?.currentPoints??opp?.totalPoints);
  const finished=w.week<liveWeek;
  const outcome=finished?(Number.isFinite(score)&&Number.isFinite(against)?score===against?'T':score>against?'W':'L':'—'):'Upcoming / Live';
  return '<div class="myteams-schedule-game"><button class="myteams-schedule-toggle" type="button" data-myteams-schedule-week="'+w.week+'" aria-expanded="false"><span class="myteams-schedule-row"><span>Week '+w.week+'</span><b class="myteams-outcome" data-result="'+escapeHtml(outcome)+'">'+escapeHtml(outcome)+'</b><span class="myteams-standing-identity">'+fantasyLogo(opp)+'<span>vs '+escapeHtml(opp?.teamName||'—')+'</span></span><strong>'+((w.week>liveWeek)?'—':fmt(score)+' – '+fmt(against))+'</strong></span></button><div class="myteams-schedule-detail" hidden></div></div>';
 }).join('')+'</div>';
}
function scheduleGameDetail(item,week){
 const entry=matchupLineups.find(x=>x.id===item.id&&Number(x.week)===week);
 const match=entry?.matchups?.find(m=>String(m.home?.teamId)===String(item.teamId)||String(m.away?.teamId)===String(item.teamId));
 const row=p=>'<div class="myteams-boxscore-player"><button type="button" class="myteams-player-open" data-myteams-player="'+escapeHtml(p.name||'')+'">'+escapeHtml(p.name||'Unknown')+'</button><strong>'+fmt(p.points)+'</strong></div>';
 if(!match)return '<p class="myteams-empty">Player-level lineup and scores were not included in the saved ESPN snapshot for Week '+week+'. Team scores are shown above.</p>';
 const side=t=>'<div><h4><button type="button" class="myteams-team-open" data-myteams-team="'+escapeHtml(t.teamId)+'">'+escapeHtml(t.teamName||'Team')+'</button></h4>'+(t.players||[]).map(row).join('')+'</div>';
 return '<div class="myteams-boxscore">'+side(match.home)+side(match.away)+'</div>';
}
function transactionsHtml(item){
 if(item.year!==2026)return '<p class="myteams-empty">Historical transactions have not been loaded.</p>';
 const entry=transactionData.find(x=>x.id===item.id);
 const tx=(entry?.tx||[]).filter(x=>['complete','completed','executed','approved','processed'].includes(String(x.status||'').toLowerCase()));
 if(!tx.length)return '<p class="myteams-empty">No recent team moves in the retrieved window.</p>';
 return '<p class="myteams-data-caption">Completed ESPN moves · '+(entry.truncated?'Latest 100 results':'Available snapshot')+'</p>'+tx.map(x=>'<div class="myteams-transaction"><small>'+escapeHtml(x.date||'')+' · '+escapeHtml(x.type||'Move')+(Number(x.faab)>0?' · <span class="myteams-faab">$'+escapeHtml(x.faab)+' FAAB</span>':'')+'</small><div>'+(x.added?.length?'<b>Added: '+escapeHtml(x.added.join(', '))+'</b>':'')+(x.dropped?.length?'<span>Dropped: '+escapeHtml(x.dropped.join(', '))+'</span>':'')+(x.type==='trade'&&!x.added?.length?'<span>Trade completed · player details unavailable</span>':'')+'</div></div>').join('');
}
function panelHtml(item,tab){
 if(item.year!==2026){const archive=historicalData.find(x=>x.id===item.id&&x.year===item.year&&x.teamId===String(item.teamId));if(tab==='roster')return rosterHtml(-1,archive);if(tab==='standings')return archive?.standings?.length?standingsTable(archive.standings):'<p class="myteams-empty">Historical standings unavailable.</p>';return '<p class="myteams-empty">Historical matchup and waiver snapshots not available for this year.</p>';}
 if(tab==='roster')return rosterHtml(item.index);
 if(tab==='standings')return standingHtml(item.id);
 if(tab==='schedule')return scheduleHtml(item);
 if(tab==='transactions')return transactionsHtml(item);
 if(tab==='matchups')return matchupHtml(item.id);
 return wireHtml(item.id);
}
function renderTeams(year){
 const current=year===2026;
 const cards=current?teamIndex.map(x=>({...x,year:2026})):pastTeams.filter(x=>x.year===year&&x.id!=='646444846'&&!/^diddy party/i.test(String(x.teamName||'').trim())).map(x=>({league:x.leagueName,team:x.teamName,year,id:x.id,teamId:x.teamId,index:-1}));
 section.querySelector('.myteams-count').textContent=cards.length+' Teams';
 section.querySelector('.myteams-header p').textContent='Your '+year+' ESPN fantasy football leagues';
 section.querySelector('.myteams-grid').innerHTML=cards.map((item,i)=>'<article class="myteams-card"><button type="button" class="myteams-card-trigger" data-myteams-open="'+i+'" aria-expanded="false"><div class="myteams-league">'+escapeHtml(item.league)+'</div><div class="myteams-card-identity">'+fantasyLogo(item)+'<div class="myteams-name">'+escapeHtml(item.team)+'</div></div>'+(current?'':'<div class="myteams-finish">'+escapeHtml(historyFinish(item))+'</div>')+'<div class="myteams-platform">ESPN · '+year+'</div></button><div class="myteams-roster" hidden></div></article>').join('');
 section._cards=cards;
}
section.innerHTML='<header class="myteams-header"><div><h2>My Teams</h2><p>2026 ESPN fantasy football leagues</p></div><div class="myteams-header-right"><label>Year <select id="myTeamsYear">'+[2026,2025,2024,2023,2022,2021,2020].map(y=>'<option value="'+y+'">'+y+'</option>').join('')+'</select></label><span class="myteams-count">11 Teams</span></div></header><div class="myteams-grid"></div>';
main.appendChild(section);
renderTeams(2026);
section.addEventListener('change',e=>{if(e.target.id==='myTeamsYear')renderTeams(Number(e.target.value));});
section.addEventListener('keydown',e=>{const row=e.target.closest('.myteams-roster-row[data-myteams-player]');if(row&&row===e.target&&(e.key==='Enter'||e.key===' ')){e.preventDefault();row.click();}});
section.addEventListener('click',e=>{
 const player=e.target.closest('[data-myteams-player]');if(player){const name=player.dataset.myteamsPlayer,pos=player.dataset.myteamsPlayerPos||'';if(typeof window.openUnifiedPlayerProfileByName==='function'){const seed=['K','D/ST','DST'].includes(pos)?{id:player.dataset.myteamsPlayerId,name,team:player.dataset.myteamsPlayerTeam||'',position:pos==='DST'?'D/ST':pos,seasonYear:2026,source:'my-teams'}:null;window.openUnifiedPlayerProfileByName(name,seed);}else if(typeof window.openPlayerProfileByName==='function')window.openPlayerProfileByName(name);return;}
 const back=e.target.closest('[data-myteams-back]');if(back){const holder=back.closest('.myteams-roster');if(holder?._previousHtml!=null){holder.querySelector('.myteams-tab-content').innerHTML=holder._previousHtml;holder._previousHtml=null;}return;}
 const team=e.target.closest('[data-myteams-team]');if(team){const holder=team.closest('.myteams-roster'),item=section._cards[Number(holder?.dataset.index)];if(item){const content=holder.querySelector('.myteams-tab-content');holder._previousHtml=content.innerHTML;content.innerHTML=otherTeamHtml(item,team.dataset.myteamsTeam);}return;}
 const game=e.target.closest('[data-myteams-schedule-week]');if(game){const holder=game.closest('.myteams-roster'),item=section._cards[Number(holder?.dataset.index)],detail=game.nextElementSibling;if(item&&detail){const expand=detail.hidden;holder.querySelectorAll('.myteams-schedule-detail').forEach(x=>x.hidden=true);holder.querySelectorAll('[data-myteams-schedule-week]').forEach(x=>x.setAttribute('aria-expanded','false'));if(expand){detail.innerHTML=scheduleGameDetail(item,Number(game.dataset.myteamsScheduleWeek));detail.hidden=false;game.setAttribute('aria-expanded','true');}}return;}
 const wirePosition=e.target.closest('[data-myteams-wire-pos]');if(wirePosition){const holder=wirePosition.closest('.myteams-roster'),item=section._cards[Number(holder?.dataset.index)];if(item)holder.querySelector('.myteams-tab-content').innerHTML=wireHtml(item.id,wirePosition.dataset.myteamsWirePos);return;}
 const tab=e.target.closest('[data-myteams-tab]');
 if(tab){const holder=tab.closest('.myteams-roster'),item=section._cards[Number(holder?.dataset.index)];if(!item)return;holder.querySelectorAll('[data-myteams-tab]').forEach(el=>el.setAttribute('aria-selected',String(el===tab)));holder.querySelector('.myteams-tab-content').innerHTML=panelHtml(item,tab.dataset.myteamsTab);return;}
 const trigger=e.target.closest('[data-myteams-open]');if(!trigger)return;
 const i=Number(trigger.dataset.myteamsOpen),card=trigger.closest('.myteams-card'),panel=card?.querySelector('.myteams-roster');
 if(!panel)return;
 const open=panel.hidden;
 section.querySelectorAll('.myteams-roster').forEach(el=>el.hidden=true);
 section.querySelectorAll('[data-myteams-open]').forEach(el=>el.setAttribute('aria-expanded','false'));
 if(open){
  const item=section._cards[i];panel.dataset.index=String(i);
  panel.innerHTML='<div class="myteams-subnav">'+(item.year===2026?['roster','standings','schedule','matchups','waivers','transactions']:['roster','standings']).map((tab,j)=>'<button type="button" data-myteams-tab="'+tab+'" aria-selected="'+(!j)+'">'+(tab==='waivers'?'Waiver Wire':tab==='transactions'?'My Moves':tab[0].toUpperCase()+tab.slice(1))+'</button>').join('')+'</div><div class="myteams-tab-content">'+panelHtml(item,'roster')+'</div>';
  panel.hidden=false;trigger.setAttribute('aria-expanded','true');
 }
});
function show(){document.body.classList.add('my-teams-open');section.hidden=false;nav.querySelectorAll('.pos').forEach(b=>b.classList.toggle('active',b===button));}
function hide(){document.body.classList.remove('my-teams-open');section.hidden=true;button.classList.remove('active');}
nav.addEventListener('click',e=>{const target=e.target.closest('[data-pos]');if(!target)return;if(target===button){e.preventDefault();e.stopImmediatePropagation();show();}else hide();},true);
document.addEventListener('click',e=>{if(e.target.closest('#shuaMyTeams'))return;if(e.target.closest('#studioNav'))hide();},true);
if(location.hash==='#my-teams')show();
button.addEventListener('click',()=>{if(!document.body.classList.contains('my-teams-open'))show();});
})();
</script>
