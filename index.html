<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHUA 2026 Fantasy Rankings</title><style>:root{--bg:#061322;--panel:#0b2139;--text:#f8fafc;--muted:#91a4ba;--red:#ff1744;--green:#35d07f;--line:rgba(150,180,210,.17)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#501430 0,transparent 31%),linear-gradient(145deg,#061322,#071c31);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}button,input{font:inherit}header{max-width:1400px;margin:auto;padding:35px 28px 24px;border-bottom:3px solid var(--red)}.kick{color:var(--red);letter-spacing:.3em;font-weight:900;font-size:.75rem}h1{font-size:clamp(2.7rem,6vw,5.8rem);line-height:.88;margin:12px 0;font-style:italic;letter-spacing:-.035em}.desc{color:var(--muted)}.sticky{position:sticky;top:0;z-index:20;background:rgba(5,18,32,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.tools{max-width:1400px;margin:auto;padding:13px 28px;display:grid;grid-template-columns:minmax(250px,1fr) auto;gap:12px;align-items:center}.search{position:relative}.search input{width:100%;height:47px;border:0;border-radius:11px;padding:0 44px 0 15px;color:#101827;font-weight:600}.clear{position:absolute;right:8px;top:7px;width:33px;height:33px;border:0;border-radius:8px;display:none}.positions{display:flex;gap:7px}.pos{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.pos.active{background:#183d63;color:#fff}main{max-width:1400px;margin:auto;padding:22px 28px 60px}.head{margin:8px 0 12px}.head h2{margin:0;font-size:1.7rem}.head small{color:var(--muted)}.card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:rgba(9,28,48,.87)}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;padding:12px 14px;background:#0b2037}td{padding:13px 14px;border-top:1px solid var(--line);vertical-align:top}tbody tr{cursor:pointer}tbody tr:hover{background:#102c4b}.rank{font-size:1.25rem;color:var(--red);font-weight:950}.badge{display:inline-flex;padding:5px 7px;border-radius:5px;background:#22517e;font-size:.72rem;font-weight:900}.adp{font-weight:900}.notes{max-width:520px;line-height:1.4;color:#d7e1ec}.draft-name{color:var(--green)}.do-not-draft-name{color:var(--red)}.suggestions{position:absolute;left:0;right:0;top:52px;background:#fff;color:#172033;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.45);overflow:hidden;display:none;max-height:390px;overflow-y:auto}.sug{padding:11px 13px;border-bottom:1px solid #e7ebf0;display:flex;justify-content:space-between;cursor:pointer}.sug:hover{background:#f2f5f8}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.profile{width:min(760px,100%);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#102c4c,#071827);border:1px solid var(--line);border-radius:18px}.ph{padding:24px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.ph h3{font-size:2.4rem;margin:4px 0}.closem{width:40px;height:40px;border:1px solid var(--line);background:transparent;color:white;border-radius:9px}.pb{padding:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid var(--line);border-radius:10px;padding:12px}.stat span{display:block;color:var(--muted);font-size:.7rem}.stat b{font-size:1.25rem;display:block;margin-top:4px}.note-box{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:16px;background:rgba(255,255,255,.03)}.note-box span{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}.note-box p{margin:0;line-height:1.55}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:900px){.tools{grid-template-columns:1fr}.positions{overflow-x:auto}.stats{grid-template-columns:1fr 1fr}.notes{max-width:none}}@media(max-width:650px){header,.tools,main{padding-left:14px;padding-right:14px}table,thead,tbody,tr,td{display:block}thead{display:none}tbody{display:grid;gap:9px;padding:9px}tbody tr{border:1px solid var(--line);border-radius:11px;padding:12px;display:grid;grid-template-columns:45px 1fr auto;gap:7px 10px}td{border:0;padding:0}.rank{grid-row:1/4}.player{grid-column:2/4}.notes{grid-column:1/4;margin-top:8px}.mobile-label:before{content:attr(data-label) ": ";color:var(--muted);font-size:.72rem;text-transform:uppercase}.hide-mobile{display:none}}</style></head><body><header><div class="kick">SHUA RANKS · BIG BOARD</div><h1>2026 Fantasy<br>Overall Rankings</h1><div class="desc">These rankings, ESPN ADP values, and notes are exactly what you provide.</div></header><div class="sticky"><div class="tools"><div class="search"><input id="search" placeholder="Search for a player…" autocomplete="off"><button class="clear" id="clear">×</button><div class="suggestions" id="suggestions"></div></div><div class="positions"><button class="pos active" data-pos="ALL">Overall</button><button class="pos" data-pos="QB">QB</button><button class="pos" data-pos="RB">RB</button><button class="pos" data-pos="WR">WR</button><button class="pos" data-pos="TE">TE</button></div></div></div><main><div class="head"><h2 id="title">My SHUA Big Board</h2><small id="sub">Your exact ranking order</small></div><div class="card"><table><thead><tr><th>Rank</th><th>Player</th><th>Position</th><th>Team</th><th>ESPN ADP</th><th>Notes</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>No players found.</div></div></main><div class="modal" id="modal"><div class="profile"><div class="ph"><div><small>PLAYER PROFILE</small><h3 id="pn"></h3><div id="pm"></div></div><button class="closem" id="close">×</button></div><div class="pb"><div class="stats" id="stats"></div><div class="note-box"><span>Your notes</span><p id="playerNotes"></p></div></div></div></div><script>let board=[],players=[],position="ALL";const $=s=>document.querySelector(s);function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}function customPlayers(data,pos){return(data.players||[]).map(x=>({id:pos.toLowerCase()+"-"+x.rank+"-"+norm(x.name),name:x.name,team:x.team||"—",position:pos,positionRank:x.rank,tier:pos+Math.ceil(x.rank/12),additionalStats:{espnAdp:x.espnAdp||"",notes:x.notes||"",tag:x.tag||""}}))}async function load(){try{const[b,p,q,r]=await Promise.all([fetch("big-board.json",{cache:"no-store"}),fetch("players.json",{cache:"no-store"}),fetch("qb-rankings.json",{cache:"no-store"}),fetch("rb-rankings.json",{cache:"no-store"})]);if(!b.ok||!p.ok||!q.ok||!r.ok)throw Error("Could not load ranking files");const bj=await b.json();players=await p.json();const qbs=customPlayers(await q.json(),"QB");const rbs=customPlayers(await r.json(),"RB");players=players.filter(x=>!['QB','RB'].includes(x.position)).concat(qbs,rbs);const byName=new Map(players.map(x=>[norm(x.name),x]));board=(bj.players||[]).map((name,i)=>{const x=byName.get(norm(name));return x?{...x,overallRank:i+1}:{id:"missing-"+i,name,team:"—",position:"—",positionRank:"—",overallRank:i+1,missing:true,additionalStats:{}}});render()}catch(e){$("#rows").innerHTML=`<tr><td colspan="6">${e.message}</td></tr>`}}function current(){if(position==="ALL")return board;return players.filter(p=>p.position===position).sort((a,b)=>a.positionRank-b.positionRank)}function displayRank(p){return position==="ALL"?p.overallRank:p.positionRank}function nameClass(p){const t=(p.additionalStats||{}).tag;return t==="draft"?"draft-name":t==="do-not-draft"?"do-not-draft-name":""}function render(){const list=current();$("#title").textContent=position==="ALL"?"My SHUA Big Board":position+" Rankings";$("#sub").textContent=position==="ALL"?"Your exact ranking order":"Your exact "+position+" ranking order";$("#rows").innerHTML=list.map(p=>{const a=p.additionalStats||{};return `<tr data-id="${p.id}"><td class="rank">#${displayRank(p)}</td><td class="player"><b class="${nameClass(p)}">${p.name}</b></td><td><span class="badge">${p.position}</span></td><td>${p.team}</td><td class="adp mobile-label" data-label="ESPN ADP">${a.espnAdp||"—"}</td><td class="notes">${a.notes||"—"}</td></tr>`}).join("");$("#empty").hidden=list.length>0;document.querySelectorAll("[data-id]").forEach(r=>r.onclick=()=>profile(r.dataset.id))}document.querySelectorAll(".pos").forEach(b=>b.onclick=()=>{position=b.dataset.pos;document.querySelectorAll(".pos").forEach(x=>x.classList.toggle("active",x===b));render()});function profile(id){const p=players.find(x=>x.id===id)||board.find(x=>x.id===id);if(!p||p.missing)return;const a=p.additionalStats||{};const overall=board.findIndex(x=>x.id===p.id)+1;$("#pn").textContent=p.name;$("#pn").className=nameClass(p);$("#pm").textContent=`${p.team} · ${p.position}`;$("#stats").innerHTML=`${overall>0?`<div class="stat"><span>Overall rank</span><b>#${overall}</b></div>`:""}<div class="stat"><span>Position</span><b>${p.position}</b></div><div class="stat"><span>Position rank</span><b>#${p.positionRank}</b></div><div class="stat"><span>ESPN ADP</span><b>${a.espnAdp||"—"}</b></div>`;$("#playerNotes").textContent=a.notes||"No notes provided.";$("#modal").classList.add("open")}$("#close").onclick=()=>$("#modal").classList.remove("open");$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("open")};$("#search").oninput=()=>{const q=norm($("#search").value);$("#clear").style.display=q?"block":"none";if(!q){$("#suggestions").style.display="none";return}const hits=players.filter(p=>norm(p.name).includes(q)).slice(0,10);$("#suggestions").innerHTML=hits.length?hits.map(p=>`<div class="sug" data-sid="${p.id}"><span><b class="${nameClass(p)}">${p.name}</b><br><small>${p.position} #${p.positionRank} · ${p.team}</small></span><b>${(p.additionalStats||{}).espnAdp||""}</b></div>`).join(""):'<div class="sug">No players found</div>';$("#suggestions").style.display="block";document.querySelectorAll("[data-sid]").forEach(x=>x.onmousedown=e=>{e.preventDefault();profile(x.dataset.sid);$("#suggestions").style.display="none"})};$("#clear").onclick=()=>{$("#search").value="";$("#clear").style.display="none";$("#suggestions").style.display="none"};load();</script></body></html>
