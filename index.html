<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHUA 2026 Fantasy Rankings</title>
<style>
:root{--bg:#061322;--panel:#0b2139;--text:#f8fafc;--muted:#91a4ba;--red:#ff1744;--green:#35d07f;--line:rgba(150,180,210,.18);--qb:#b28bd4;--rb:#79c8ad;--wr:#53a6cf;--te:#d39a49}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#501430 0,transparent 31%),linear-gradient(145deg,#061322,#071c31);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{max-width:1500px;margin:auto;padding:30px 22px 20px;border-bottom:3px solid var(--red)}.kick{color:var(--red);letter-spacing:.3em;font-weight:900;font-size:.75rem}h1{font-size:clamp(2.6rem,6vw,5.6rem);line-height:.9;margin:12px 0;font-style:italic}.sticky{position:sticky;top:0;z-index:20;background:rgba(5,18,32,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.tools{max-width:1500px;margin:auto;padding:12px 22px;display:grid;grid-template-columns:minmax(250px,1fr) auto;gap:12px}.search{position:relative}.search input,.pool-head input{width:100%;height:44px;border:0;border-radius:10px;padding:0 14px;color:#101827;font-weight:700}.positions,.team-options,.mock-actions,.mock-filters{display:flex;gap:7px;flex-wrap:wrap}.pos,.team-btn,.mock-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:9px 13px;font-weight:900}.pos.active,.team-btn.active,.mock-btn.primary{background:#183d63;color:#fff}.mock-btn.danger{border-color:#7f1d1d;color:#fecaca}.mock-btn:disabled{opacity:.45;cursor:not-allowed}main{max-width:1500px;margin:auto;padding:20px 22px 60px}.head{margin:5px 0 12px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}.head h2{margin:0;font-size:1.7rem}.head small{color:var(--muted)}.board,.draft-board{display:grid;gap:4px;overflow-x:auto;padding-bottom:6px}.pick,.drafted{min-width:125px;min-height:78px;border-radius:9px;padding:8px 9px;color:#061322;position:relative;border:2px solid rgba(0,0,0,.2);overflow:hidden}.pick{cursor:pointer}.pick:hover{filter:brightness(1.07);transform:translateY(-1px)}.pick.rb,.drafted.rb{background:var(--rb)}.pick.wr,.drafted.wr{background:var(--wr)}.pick.te,.drafted.te{background:var(--te)}.pick.qb,.drafted.qb{background:var(--qb)}.pick .name,.drafted .name{font-size:.86rem;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick .slot,.drafted .slot{font-size:.68rem;font-weight:900;opacity:.7}.pick .meta,.drafted .team{font-size:.7rem;font-weight:800;margin-top:4px}.pick .arrow,.drafted .arrow{position:absolute;left:8px;bottom:5px;font-weight:950}.pick .slot{position:absolute;right:8px;top:8px}.card,.player-pool{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:rgba(9,28,48,.88)}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;padding:12px 14px;background:#0b2037}td{padding:13px 14px;border-top:1px solid var(--line);vertical-align:top}tbody tr{cursor:pointer}tbody tr:hover{background:#102c4b}.rank{font-size:1.25rem;color:var(--red);font-weight:950}.badge{display:inline-flex;padding:5px 7px;border-radius:5px;background:#22517e;font-size:.72rem;font-weight:900}.notes{max-width:520px;line-height:1.4;color:#d7e1ec}.draft-name{color:var(--green)}.do-not-draft-name{color:var(--red)}.suggestions{position:absolute;left:0;right:0;top:49px;background:white;color:#172033;border-radius:12px;box-shadow:0 20px 50px #0008;display:none;max-height:390px;overflow:auto;z-index:40}.sug{padding:11px 13px;border-bottom:1px solid #e7ebf0;cursor:pointer}.mock-setup{display:flex;gap:10px;align-items:end;padding:12px;margin-bottom:12px;flex-wrap:wrap}.mock-setup label{display:grid;gap:4px;color:var(--muted);font-size:.72rem;font-weight:800}.mock-setup select{width:92px;border:1px solid var(--line);background:#081a2d;color:white;border-radius:8px;padding:7px 8px}.mock-status{padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#081a2d}.mock-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,.7fr);gap:14px;align-items:start}.drafted.empty-slot{background:#0d2945;color:var(--muted);border:1px dashed #315474}.drafted.user-pick{box-shadow:inset 0 0 0 3px white}.draft-btn{border:0;border-radius:8px;background:var(--green);color:#052014;padding:8px 12px;font-weight:950}.draft-btn:disabled{background:#29493a;color:#8da99a;cursor:not-allowed}.player-pool{position:sticky;top:76px;max-height:calc(100vh - 90px)}.pool-head{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:9px}.pool-list{max-height:calc(100vh - 230px);overflow:auto}.pool-player{width:100%;display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:white}.pool-player:hover{background:#102c4b}.pool-rank{color:var(--red);font-weight:950}.pool-meta{color:var(--muted);font-size:.75rem}.on-clock{color:#86efac;font-weight:900}.roster{margin-top:14px}.roster-grid{display:grid;grid-template-columns:1fr;gap:7px}.roster-card{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#081a2d;min-height:64px;cursor:pointer}.roster-card:hover{background:#102c4b}.roster-card .label{display:block;color:var(--muted);font-size:.7rem;font-weight:900;margin-bottom:4px}.roster-card b{display:block}.roster-card span{color:var(--muted);font-size:.8rem}.roster-card.empty-slot b{color:#60758b;font-weight:700}.bench-heading{margin:12px 0 4px;color:var(--muted);font-size:.78rem;font-weight:950;letter-spacing:.08em}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:60}.modal.open{display:flex}.profile{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0b2139;border:1px solid var(--line);border-radius:18px;padding:22px}.closem{float:right;background:transparent;color:white;border:1px solid var(--line);border-radius:8px;padding:8px 12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.note-box{border:1px solid var(--line);border-radius:10px;padding:12px}.stat span,.note-box span{display:block;color:var(--muted);font-size:.7rem}.stat b{display:block;font-size:1.2rem;margin-top:4px}.note-box{margin-top:14px}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:1000px){.mock-layout{grid-template-columns:1fr}.player-pool{position:static;max-height:none}.pool-list{max-height:620px}.stats{grid-template-columns:1fr 1fr}}@media(max-width:900px){.tools{grid-template-columns:1fr}}@media(max-width:650px){header,.tools,main{padding-left:12px;padding-right:12px}.mock-setup select{width:78px}table,thead,tbody,tr,td{display:block}thead{display:none}tbody{display:grid;gap:9px;padding:9px}tbody tr{border:1px solid var(--line);border-radius:11px;padding:12px}}
</style></head><body>
<header><div class="kick">SHUA RANKS · BIG BOARD</div><h1>2026 Fantasy<br>Overall Rankings</h1></header>
<div class="sticky"><div class="tools"><div class="search"><input id="search" placeholder="Search for a player…" autocomplete="off"><div class="suggestions" id="suggestions"></div></div><div class="positions"><button class="pos active" data-pos="ALL">Overall</button><button class="pos" data-pos="QB">QB</button><button class="pos" data-pos="RB">RB</button><button class="pos" data-pos="WR">WR</button><button class="pos" data-pos="TE">TE</button><button class="pos" data-pos="MOCK">Mock Draft</button></div></div></div>
<main><div class="head"><div><h2 id="title">My SHUA Big Board</h2><small id="sub"></small></div><div id="teamControls" class="team-options"><button class="team-btn active" data-teams="10">10 Man</button><button class="team-btn" data-teams="12">12 Man</button><button class="team-btn" data-teams="14">14 Man</button></div></div><div id="board" class="board"></div><div id="tableCard" class="card" hidden><table><thead><tr><th>Rank</th><th>Player</th><th>Position</th><th>Team</th><th>ESPN ADP</th><th>Notes</th></tr></thead><tbody id="rows"></tbody></table></div>
<section id="mockSection" hidden><div class="card mock-setup"><label>Teams<select id="mockTeams"><option>10</option><option>12</option><option>14</option></select></label><label>Your slot<select id="mockSlot"></select></label><button id="startMock" class="mock-btn primary">Start Mock Draft</button></div><div id="mockStatus" class="mock-status">Choose your settings and start the draft.</div><div class="mock-actions"><button id="undoPick" class="mock-btn" disabled>Undo</button><button id="resetMock" class="mock-btn danger" disabled>Reset Draft</button></div><div class="mock-layout"><div><div id="draftBoard" class="draft-board"></div><div class="roster"><h3>My Team</h3><div id="myRoster" class="roster-grid"></div></div></div><div class="player-pool"><div class="pool-head"><input id="poolSearch" placeholder="Search available players…"><div class="mock-filters"><button class="mock-btn pool-filter primary" data-filter="ALL">All</button><button class="mock-btn pool-filter" data-filter="QB">QB</button><button class="mock-btn pool-filter" data-filter="RB">RB</button><button class="mock-btn pool-filter" data-filter="WR">WR</button><button class="mock-btn pool-filter" data-filter="TE">TE</button></div></div><div id="poolList" class="pool-list"></div></div></div></section></main>
<div class="modal" id="modal"><div class="profile"><button class="closem" id="close">×</button><small>PLAYER PROFILE</small><h2 id="pn"></h2><div id="pm"></div><div class="stats" id="stats"></div><div class="note-box"><span>Your notes</span><p id="playerNotes"></p></div></div></div>
<script>
let board=[],players=[],position='ALL',teamCount=10;let mock={active:false,teams:10,slot:1,rounds:14,picks:[],filter:'ALL',search:''};const $=s=>document.querySelector(s);const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');function shortName(name){const p=String(name).trim().split(/\s+/);return p.length<2?name:p[0][0]+'. '+p.slice(1).join(' ')}function custom(rows,pos){return(rows||[]).map(x=>({id:pos.toLowerCase()+'-'+x.rank+'-'+norm(x.name),name:x.name,team:x.team||'—',position:pos,positionRank:Number(x.rank),additionalStats:{espnAdp:x.espnAdp||'',notes:x.notes||'',tag:x.tag||''}}))}function nameClass(p){const t=(p.additionalStats||{}).tag;return t==='draft'?'draft-name':t==='do-not-draft'?'do-not-draft-name':''}
async function load(){try{const urls=['big-board.json','players.json','qb-rankings.json','rb-rankings.json','wr-rankings.json','te-rankings.json'];const rs=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'})));if(rs.some(r=>!r.ok))throw Error('Could not load ranking files');const[b,p,q,r,w,t]=await Promise.all(rs.map(x=>x.json()));players=(p||[]).filter(x=>!['QB','RB','WR','TE'].includes(x.position)).concat(custom(q.players,'QB'),custom(r.players,'RB'),custom(w.players,'WR'),custom(t.players,'TE'));const byName=new Map(players.map(x=>[norm(x.name),x]));board=(b.players||[]).map((name,i)=>{const x=byName.get(norm(name));return x?{...x,overallRank:i+1}:{id:'missing-'+i,name,team:'—',position:'—',positionRank:'—',overallRank:i+1,missing:true,additionalStats:{}}});syncMockSlotOptions();render()}catch(e){$('#board').innerHTML='<div class="empty">'+e.message+'</div>'}}
function current(){return position==='ALL'?board:players.filter(p=>p.position===position).sort((a,b)=>a.positionRank-b.positionRank)}function render(){const overall=position==='ALL',isMock=position==='MOCK',list=current();$('#title').textContent=isMock?'Mock Draft':overall?'My SHUA Big Board':position+' Rankings';$('#sub').textContent=overall?teamCount+'-team snake draft':'';$('#teamControls').hidden=!overall;$('#board').hidden=!overall;$('#tableCard').hidden=overall||isMock;$('#mockSection').hidden=!isMock;if(overall)renderOverall(list);else if(isMock)renderMock();else renderTable(list)}
function renderOverall(list){$('#board').style.gridTemplateColumns=`repeat(${teamCount},minmax(125px,1fr))`;const display=[];for(let start=0;start<list.length;start+=teamCount){const round=Math.floor(start/teamCount)+1,chunk=list.slice(start,start+teamCount);if(round%2===0)chunk.reverse();display.push(...chunk)}$('#board').innerHTML=display.map(p=>{const i=p.overallRank-1,r=Math.floor(i/teamCount)+1,slot=i%teamCount+1,arrow=r%2?'→':'←';return `<div class="pick ${String(p.position).toLowerCase()}" data-id="${p.id}"><div class="name">${shortName(p.name)}</div><div class="slot">${r}.${String(slot).padStart(2,'0')}</div><div class="meta">${p.position} · ${p.team}</div><div class="arrow">${arrow}</div></div>`}).join('');bindProfiles()}
function renderTable(list){$('#rows').innerHTML=list.map(p=>{const a=p.additionalStats||{};return `<tr data-id="${p.id}"><td class="rank">#${p.positionRank}</td><td><b class="${nameClass(p)}">${p.name}</b></td><td><span class="badge">${p.position}</span></td><td>${p.team}</td><td>${a.espnAdp||'—'}</td><td class="notes">${a.notes||'—'}</td></tr>`}).join('');bindProfiles()}function bindProfiles(){document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>profile(x.dataset.id))}
document.querySelectorAll('.pos').forEach(b=>b.onclick=()=>{position=b.dataset.pos;document.querySelectorAll('.pos').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('.team-btn').forEach(b=>b.onclick=()=>{teamCount=Number(b.dataset.teams);document.querySelectorAll('.team-btn').forEach(x=>x.classList.toggle('active',x===b));render()});
function profile(id){const p=players.find(x=>x.id===id)||board.find(x=>x.id===id);if(!p||p.missing)return;const a=p.additionalStats||{},overall=board.findIndex(x=>norm(x.name)===norm(p.name))+1;$('#pn').textContent=p.name;$('#pn').className=nameClass(p);$('#pm').textContent=`${p.team} · ${p.position}`;$('#stats').innerHTML=`${overall>0?`<div class="stat"><span>Overall rank</span><b>#${overall}</b></div>`:''}<div class="stat"><span>Position</span><b>${p.position}</b></div><div class="stat"><span>Position rank</span><b>#${p.positionRank}</b></div><div class="stat"><span>ESPN ADP</span><b>${a.espnAdp||'—'}</b></div>`;$('#playerNotes').textContent=a.notes||'No notes provided.';$('#modal').classList.add('open')}$('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};
$('#search').oninput=e=>{const q=norm(e.target.value);if(!q){$('#suggestions').style.display='none';return}const hits=players.filter(p=>norm(p.name).includes(q)).slice(0,10);$('#suggestions').innerHTML=hits.length?hits.map(p=>`<div class="sug" data-sid="${p.id}"><b class="${nameClass(p)}">${p.name}</b><br><small>${p.position} #${p.positionRank} · ${p.team}</small></div>`).join(''):'<div class="sug">No players found</div>';$('#suggestions').style.display='block';document.querySelectorAll('[data-sid]').forEach(x=>x.onmousedown=ev=>{ev.preventDefault();profile(x.dataset.sid);$('#suggestions').style.display='none'})};
function syncMockSlotOptions(){const n=Number($('#mockTeams').value),old=Number($('#mockSlot').value)||1;$('#mockSlot').innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');$('#mockSlot').value=Math.min(old,n)}$('#mockTeams').addEventListener('change',syncMockSlotOptions);function snakeTeamForPick(i,teams){const r=Math.floor(i/teams)+1,o=i%teams;return r%2?o+1:teams-o}function slotLabel(i,teams){const r=Math.floor(i/teams)+1,o=i%teams;return `${r}.${String(o+1).padStart(2,'0')}`}function mockPlayerPool(){const seen=new Set(),ranked=[];for(const p of board){if(!p.missing&&!seen.has(p.id)){seen.add(p.id);ranked.push(p)}}const extras=players.filter(p=>!seen.has(p.id)).sort((a,b)=>(a.positionRank||999)-(b.positionRank||999));return ranked.concat(extras)}function availablePlayers(){const used=new Set(mock.picks.map(x=>x.player.id));return mockPlayerPool().filter(p=>!used.has(p.id))}
function startMock(){mock={active:true,teams:Number($('#mockTeams').value),slot:Number($('#mockSlot').value),rounds:14,picks:[],filter:'ALL',search:''};$('#poolSearch').value='';simUntilUser()}function simUntilUser(){if(!mock.active)return;const total=mock.teams*mock.rounds;let safety=0;while(mock.picks.length<total&&snakeTeamForPick(mock.picks.length,mock.teams)!==mock.slot&&safety<total){const p=availablePlayers()[0];if(!p)break;mock.picks.push({player:p,team:snakeTeamForPick(mock.picks.length,mock.teams),cpu:true});safety++}renderMock()}function userPick(id){if(!mock.active||snakeTeamForPick(mock.picks.length,mock.teams)!==mock.slot)return;const p=availablePlayers().find(x=>x.id===id);if(!p)return;mock.picks.push({player:p,team:mock.slot,cpu:false});simUntilUser()}
function rosterSlots(mine){const defs=[['QB',p=>p.position==='QB'],['RB',p=>p.position==='RB'],['RB',p=>p.position==='RB'],['WR',p=>p.position==='WR'],['WR',p=>p.position==='WR'],['TE',p=>p.position==='TE'],['FLEX',p=>['RB','WR','TE'].includes(p.position)]];const remaining=[...mine],slots=[];for(const [label,test] of defs){const i=remaining.findIndex(test);slots.push({label,player:i>=0?remaining.splice(i,1)[0]:null})}return {starters:slots,bench:remaining}}
function renderMock(){const total=mock.teams*14,pickIndex=mock.picks.length,onClock=mock.active&&pickIndex<total?snakeTeamForPick(pickIndex,mock.teams):null;$('#undoPick').disabled=!mock.picks.length;$('#resetMock').disabled=!mock.active;if(!mock.active){$('#draftBoard').innerHTML='';const rs=rosterSlots([]);$('#myRoster').innerHTML=rs.starters.map(s=>`<div class="roster-card empty-slot"><span class="label">${s.label}</span><b>Empty</b></div>`).join('')+'<div class="bench-heading">BENCH</div>';$('#mockStatus').textContent='Choose your settings and start the draft.';renderPool();return}$('#mockStatus').innerHTML=pickIndex>=total?'Draft complete.':onClock===mock.slot?`<span class="on-clock">You are on the clock — pick ${slotLabel(pickIndex,mock.teams)}</span>`:`Computer team ${onClock} is on the clock.`;$('#draftBoard').style.gridTemplateColumns=`repeat(${mock.teams},minmax(125px,1fr))`;const visible=Math.min(total,Math.max(mock.teams*2,Math.ceil((pickIndex+mock.teams)/mock.teams)*mock.teams)),display=[];for(let start=0;start<visible;start+=mock.teams){const r=Math.floor(start/mock.teams)+1,chunk=Array.from({length:Math.min(mock.teams,visible-start)},(_,j)=>start+j);if(r%2===0)chunk.reverse();display.push(...chunk)}$('#draftBoard').innerHTML=display.map(i=>{const d=mock.picks[i],team=snakeTeamForPick(i,mock.teams),r=Math.floor(i/mock.teams)+1,arrow=r%2?'→':'←';if(!d)return `<div class="drafted empty-slot"><div class="slot">${slotLabel(i,mock.teams)} · Team ${team}</div><div class="arrow">${arrow}</div></div>`;const p=d.player;return `<div class="drafted ${p.position.toLowerCase()} ${d.team===mock.slot?'user-pick':''}" data-id="${p.id}"><div class="slot">${slotLabel(i,mock.teams)} · Team ${d.team}</div><div class="name">${shortName(p.name)}</div><div class="team">${p.position} · ${p.team}</div><div class="arrow">${arrow}</div></div>`}).join('');const mine=mock.picks.filter(x=>x.team===mock.slot).map(x=>x.player),rs=rosterSlots(mine);$('#myRoster').innerHTML=rs.starters.map(s=>s.player?`<div class="roster-card" data-id="${s.player.id}"><span class="label">${s.label}</span><b>${s.player.name}</b><span>${s.player.position} · ${s.player.team}</span></div>`:`<div class="roster-card empty-slot"><span class="label">${s.label}</span><b>Empty</b></div>`).join('')+'<div class="bench-heading">BENCH</div>'+rs.bench.map(p=>`<div class="roster-card" data-id="${p.id}"><b>${p.name}</b><span>${p.position} · ${p.team}</span></div>`).join('');bindProfiles();renderPool()}
function renderPool(){if(!board.length)return;const canPick=mock.active&&snakeTeamForPick(mock.picks.length,mock.teams)===mock.slot,q=norm(mock.search),list=availablePlayers().filter(p=>(mock.filter==='ALL'||p.position===mock.filter)&&(!q||norm(p.name).includes(q))).slice(0,160);$('#poolList').innerHTML=list.map((p,i)=>`<div class="pool-player"><span class="pool-rank">${i+1}</span><span data-id="${p.id}" style="cursor:pointer"><b class="${nameClass(p)}">${p.name}</b><div class="pool-meta">${p.position} #${p.positionRank} · ${p.team}</div></span><button class="draft-btn" data-pick="${p.id}" ${canPick?'':'disabled'}>Draft</button></div>`).join('')||'<div class="empty">No available players.</div>';document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>userPick(b.dataset.pick));bindProfiles()}
$('#startMock').onclick=startMock;$('#undoPick').onclick=()=>{if(mock.picks.length){mock.picks.pop();renderMock()}};$('#resetMock').onclick=()=>{mock.active=false;mock.picks=[];renderMock()};$('#poolSearch').oninput=e=>{mock.search=e.target.value;renderPool()};document.querySelectorAll('.pool-filter').forEach(b=>b.onclick=()=>{mock.filter=b.dataset.filter;document.querySelectorAll('.pool-filter').forEach(x=>x.classList.toggle('primary',x===b));renderPool()});load();
</script></body></html>
