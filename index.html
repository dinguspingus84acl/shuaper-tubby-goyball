const nav=document.querySelector('.positions');
const main=document.querySelector('main');

button.type='button';button.className='pos';button.dataset.pos='MYTEAMS';button.textContent='My Teams';
nav.appendChild(button);
const section=document.createElement('section');
section.id='shuaMyTeams';section.hidden=true;
const escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rosterHtml(index){
 const snapshot=rosterSnapshots[index];
 if(!snapshot?.roster?.length)return '<p class="myteams-empty">Roster unavailable from ESPN for this team.</p>';
 const slotOrder=['QB','RB','WR','TE','RB/WR/TE','FLEX','OP','D/ST','K','Bench','IR'];
 const items=[...snapshot.roster].sort((a,b)=>{
  const ia=slotOrder.indexOf(a.slot),ib=slotOrder.indexOf(b.slot);
  return (ia<0?20:ia)-(ib<0?20:ib)||a.name.localeCompare(b.name);
 });
 return '<div class="myteams-roster-head"><span>Lineup</span><span>Player</span><span>Position</span></div>'+items.map(p=>{
 const image=p.id?'<img loading="lazy" src="https://a.espncdn.com/i/headshots/nfl/players/full/'+encodeURIComponent(p.id)+'.png" alt="" onerror="this.style.display=\'none\'">':'';
 const nfl=p.nfl?'<small>'+escapeHtml(p.nfl)+'</small>':'';
 const injury=p.status&&p.status!=='Active'?'<small class="myteams-injury">'+escapeHtml(p.status)+'</small>':'';
 return '<div class="myteams-roster-row"><span class="myteams-slot">'+escapeHtml(p.slot||'—')+'</span><div class="myteams-player">'+image+'<span><b>'+escapeHtml(p.name||'Unknown')+'</b>'+nfl+injury+'</span></div><strong>'+escapeHtml(p.pos||'—')+'</strong></div>';
 }).join('');
}
section.innerHTML='<header class="myteams-header"><div><h2>My Teams</h2><p>Your 2026 ESPN fantasy football leagues</p></div><span class="myteams-count">'+leagues.length+' Teams</span></header><div class="myteams-grid">'+leagues.map(([league,team])=>'<article class="myteams-card"><button type="button" class="myteams-card-trigger" data-myteams-open="'+leagues.findIndex(x=>x[0]===league)+'" aria-expanded="false"><div class="myteams-league">'+escapeHtml(league)+'</div><div class="myteams-name">'+escapeHtml(team)+'</div><div class="myteams-platform">ESPN · 2026</div><span class="myteams-chevron">View roster ▾</span></button><div class="myteams-roster" hidden></div></article>').join('')+'</div>';

});
function show(){document.body.classList.add('my-teams-open');section.hidden=false;nav.querySelectorAll('.pos').forEach(b=>b.classList.toggle('active',b===button));}
