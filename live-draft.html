<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHUA Live Draft Room</title>
<style>
:root{--bg:#061322;--panel:#0b2139;--text:#f8fafc;--muted:#91a4ba;--red:#ff1744;--green:#35d07f;--line:#ffffff25;--qb:#b28bd4;--rb:#79c8ad;--wr:#53a6cf;--te:#d39a49}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#061322,#071c31);color:var(--text);font:14px Inter,system-ui}button,input,select{font:inherit}button{cursor:pointer}header,main{max-width:1500px;margin:auto}header{padding:26px 20px;border-bottom:3px solid var(--red)}h1{margin:4px 0;font-size:clamp(2rem,5vw,4.5rem);font-style:italic}.kick{color:var(--red);font-weight:900;letter-spacing:.2em}.card{background:#091c30e8;border:1px solid var(--line);border-radius:14px;padding:14px}.setup{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;margin:18px 0}.setup label{display:grid;gap:5px;color:var(--muted)}input,select{height:42px;border:0;border-radius:8px;padding:0 10px}.btn{border:1px solid var(--line);border-radius:8px;padding:10px 13px;background:#183d63;color:#fff;font-weight:900}.btn.green{background:var(--green);color:#061322}.btn.red{background:var(--red)}main{padding:0 20px 60px}.room-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.code{font-size:1.4rem;font-weight:950}.status{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}.board{display:grid;gap:4px;overflow-x:auto}.pick{min-width:125px;min-height:76px;border-radius:8px;padding:8px;color:#061322;position:relative}.qb{background:var(--qb)}.rb{background:var(--rb)}.wr{background:var(--wr)}.te{background:var(--te)}.empty{background:#0d2945;color:var(--muted);border:1px solid var(--line)}.slot{font-size:.68rem;font-weight:900}.name{font-weight:950;margin-top:7px}.meta{font-size:.72rem;margin-top:4px}.arrow{position:absolute;left:8px;bottom:5px}.side{position:sticky;top:10px}.pool-head{display:grid;gap:8px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:7px 9px;font-weight:900}.filters button.active{background:#183d63;color:#fff}.pool{height:55vh;overflow:auto;margin-top:10px}.player{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.rank{color:var(--red);font-weight:950}.sub{color:var(--muted);font-size:.75rem}.draft{border:0;border-radius:7px;background:var(--green);padding:8px 10px;font-weight:950}.draft:disabled{opacity:.35}.teams{display:grid;gap:6px;margin-top:10px}.team-row{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px}.on-clock{outline:2px solid var(--green)}.hidden{display:none!important}.notice{padding:12px;border-radius:9px;background:#3d1420;border:1px solid #ff174488;margin:15px 0}.copy{background:transparent;border:1px solid var(--line);color:#fff;border-radius:7px;padding:7px 9px}@media(max-width:1050px){.setup{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.side{position:static}.pool{height:600px}}@media(max-width:620px){.setup{grid-template-columns:1fr}.layout{display:block}.side{margin-top:14px}}
</style>
</head>
<body>
<header><div class="kick">SHUA RANKS · LIVE</div><h1>Multiplayer Draft Room</h1></header>
<main>
<div id="configNotice" class="notice hidden">Firebase is not configured yet. Add your Firebase web-app values to <b>firebase-config.js</b>.</div>
<div class="card setup" id="setup">
<label>Your name<input id="displayName" placeholder="Jack"></label>
<label>Room code<input id="roomCode" maxlength="8" placeholder="ABCD12"></label>
<label>Teams<select id="teamCount"><option>10</option><option>12</option><option>14</option></select></label>
<label>Your draft slot<select id="draftSlot"></select></label>
<button class="btn green" id="createRoom">Create room</button>
<button class="btn" id="joinRoom">Join room</button>
</div>
<div id="room" class="hidden">
<div class="card room-bar"><div><div class="code">Room <span id="activeCode"></span> <button class="copy" id="copyLink">Copy invite link</button></div><div class="status" id="status"></div></div><div><button class="btn" id="startDraft">Start Draft</button> <button class="btn red" id="leaveRoom">Leave</button></div></div>
<div class="layout">
<div><div id="board" class="board"></div></div>
<div class="side">
<div class="card"><div class="pool-head"><input id="search" placeholder="Search available players"><div class="filters"><button class="active" data-filter="ALL">All</button><button data-filter="QB">QB</button><button data-filter="RB">RB</button><button data-filter="WR">WR</button><button data-filter="TE">TE</button></div></div><div id="pool" class="pool"></div></div>
<div class="card" style="margin-top:12px"><b>Teams</b><div id="teams" class="teams"></div></div>
</div>
</div>
</div>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getDatabase, ref, set, get, update, onValue, runTransaction, remove } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
import { firebaseConfig } from './firebase-config.js';

const $=s=>document.querySelector(s), N=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
let db=null, roomId='', clientId=crypto.randomUUID(), state=null, players=[], filter='ALL';
const configured=!Object.values(firebaseConfig).some(v=>String(v).startsWith('PASTE_'));
if(configured){db=getDatabase(initializeApp(firebaseConfig))}else $('#configNotice').classList.remove('hidden');

function slotOptions(){let n=+$('#teamCount').value;$('#draftSlot').innerHTML=Array.from({length:n},(_,i)=>`<option>${i+1}</option>`).join('')}
slotOptions();$('#teamCount').onchange=slotOptions;
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function teamAt(i,t){let r=Math.floor(i/t)+1,o=i%t;return r%2?o+1:t-o}
function label(i,t){return `${Math.floor(i/t)+1}.${String(i%t+1).padStart(2,'0')}`}
async function loadPlayers(){let [b,q,rb,w,t]=await Promise.all(['big-board.json','qb-rankings.json','rb-rankings.json','wr-rankings.json','te-rankings.json'].map(x=>fetch(x,{cache:'no-store'}).then(r=>r.json())));let maps={QB:q.players,RB:rb.players,WR:w.players,TE:t.players},all=[];Object.entries(maps).forEach(([pos,a])=>a.forEach(x=>all.push({id:pos.toLowerCase()+'-'+x.rank+'-'+N(x.name),name:x.name,team:x.team||'—',position:pos,positionRank:+x.rank})));let m=new Map(all.map(p=>[N(p.name),p]));players=b.players.map((n,i)=>m.get(N(n))?{...m.get(N(n)),overallRank:i+1}:{id:'overall-'+i,name:n,team:'—',position:'—',positionRank:'—',overallRank:i+1});all.forEach(p=>{if(!players.some(x=>x.id===p.id))players.push(p)})}
await loadPlayers();

async function createRoom(){if(!db)return alert('Firebase must be configured first.');let name=$('#displayName').value.trim()||'Host',teams=+$('#teamCount').value,slot=+$('#draftSlot').value;roomId=code();let room={createdAt:Date.now(),hostId:clientId,teams,rounds:14,status:'lobby',currentPick:0,picks:{},members:{[clientId]:{name,slot,joinedAt:Date.now()}}};await set(ref(db,'rooms/'+roomId),room);openRoom(roomId)}
async function joinRoom(){if(!db)return alert('Firebase must be configured first.');let id=$('#roomCode').value.trim().toUpperCase();if(!id)return alert('Enter a room code.');let snap=await get(ref(db,'rooms/'+id));if(!snap.exists())return alert('Room not found.');let r=snap.val(),slot=+$('#draftSlot').value,name=$('#displayName').value.trim()||'Guest';let taken=Object.values(r.members||{}).some(m=>+m.slot===slot);if(taken)return alert('That draft slot is already taken. Choose another.');await set(ref(db,`rooms/${id}/members/${clientId}`),{name,slot,joinedAt:Date.now()});openRoom(id)}
function openRoom(id){roomId=id;history.replaceState(null,'',`?room=${id}`);$('#setup').classList.add('hidden');$('#room').classList.remove('hidden');$('#activeCode').textContent=id;onValue(ref(db,'rooms/'+id),snap=>{if(!snap.exists()){alert('Room closed.');location.href='live-draft.html';return}state=snap.val();render()})}
async function startDraft(){if(state.hostId!==clientId)return alert('Only the host can start the draft.');await update(ref(db,'rooms/'+roomId),{status:'drafting',currentPick:0})}
async function draft(id){if(!state||state.status!=='drafting')return;let i=state.currentPick||0,t=teamAt(i,state.teams),me=state.members?.[clientId];if(!me||+me.slot!==t)return;let p=players.find(x=>x.id===id);if(!p)return;await runTransaction(ref(db,'rooms/'+roomId),room=>{if(!room||room.status!=='drafting')return room;let idx=room.currentPick||0;if(teamAt(idx,room.teams)!==+room.members[clientId].slot)return room;if(Object.values(room.picks||{}).some(x=>x.player.id===id))return room;room.picks=room.picks||{};room.picks[idx]={player:p,team:+room.members[clientId].slot,by:clientId,at:Date.now()};room.currentPick=idx+1;if(room.currentPick>=room.teams*room.rounds)room.status='complete';return room})}
function render(){let picks=state.picks||{},total=state.teams*state.rounds,i=state.currentPick||0,current=state.status==='drafting'?teamAt(i,state.teams):null,me=state.members?.[clientId];$('#startDraft').style.display=state.hostId===clientId&&state.status==='lobby'?'inline-block':'none';$('#status').textContent=state.status==='lobby'?'Waiting for host to start':state.status==='complete'?'Draft complete':current===+me?.slot?`You are on the clock — ${label(i,state.teams)}`:`Team ${current} is on the clock`;$('#board').style.gridTemplateColumns=`repeat(${state.teams},minmax(125px,1fr))`;let order=[];for(let s=0;s<total;s+=state.teams){let r=s/state.teams+1,row=Array.from({length:Math.min(state.teams,total-s)},(_,j)=>s+j);if(r%2===0)row.reverse();order.push(...row)}$('#board').innerHTML=order.map(n=>{let d=picks[n],r=Math.floor(n/state.teams)+1;if(!d)return `<div class="pick empty"><div class="slot">${label(n,state.teams)}</div><div class="arrow">${r%2?'→':'←'}</div></div>`;let p=d.player;return `<div class="pick ${p.position.toLowerCase()}"><div class="slot">${label(n,state.teams)}</div><div class="name">${p.name}</div><div class="meta">${p.position} · ${p.team}</div></div>`}).join('');let used=new Set(Object.values(picks).map(x=>x.player.id)),q=N($('#search').value),available=players.filter(p=>!used.has(p.id)&&(filter==='ALL'||p.position===filter)&&(!q||N(p.name).includes(q)));let can=state.status==='drafting'&&current===+me?.slot;$('#pool').innerHTML=available.map((p,j)=>`<div class="player"><b class="rank">${j+1}</b><div><b>${p.name}</b><div class="sub">${p.position} #${p.positionRank} · ${p.team}</div></div><button class="draft" data-pick="${p.id}" ${can?'':'disabled'}>Draft</button></div>`).join('');document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>draft(b.dataset.pick));let members=state.members||{};$('#teams').innerHTML=Array.from({length:state.teams},(_,x)=>x+1).map(t=>{let m=Object.values(members).find(x=>+x.slot===t);return `<div class="team-row ${current===t?'on-clock':''}"><b>Team ${t}</b><span>${m?m.name:'CPU / Open'}</span></div>`}).join('')}

$('#createRoom').onclick=createRoom;$('#joinRoom').onclick=joinRoom;$('#startDraft').onclick=startDraft;$('#leaveRoom').onclick=async()=>{if(db&&roomId)await remove(ref(db,`rooms/${roomId}/members/${clientId}`));location.href='live-draft.html'};$('#copyLink').onclick=()=>navigator.clipboard.writeText(`${location.origin}${location.pathname}?room=${roomId}`);$('#search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
let invite=new URLSearchParams(location.search).get('room');if(invite){$('#roomCode').value=invite.toUpperCase()}
</script>
</body>
</html>
